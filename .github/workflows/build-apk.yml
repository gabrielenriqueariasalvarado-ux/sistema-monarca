name: Compilar APK Android de Sistema Monarca

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK Nativa Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 4. Instalar dependencias npm
        run: npm install

      - name: 5. Preparar directorio web www/ y compilar Capacitor Bridge
        run: |
          mkdir -p www
          cp index.html style.css www/
          cp -r js icons www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f version.json ] && cp version.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          [ -f app.js ] && cp app.js www/ || true
          npx esbuild js/capacitor-bridge-entry.js --bundle --minify --outfile=www/js/capacitor-bridge.js
          echo "Archivos web y Capacitor Bridge compilados en www/ exitosamente"

      - name: 6. Añadir plataforma Android de Capacitor
        run: npx cap add android || true

      - name: 7. Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: 8. Inyectar Componentes Nativos de Alarma Despertador a Pantalla Completa (Java)
        run: python3 scripts/configure_android.py

      - name: 9. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Sistema-Monarca.apk

      - name: 10. Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Monarca-APK
          path: Sistema-Monarca.apk
          retention-days: 30

      - name: 11. Publicar Release con la APK para descarga directa en móvil
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Sistema Monarca · Emily (APK Nativa Android v11.26)"
          body: |
            ### 📱 APK Nativa de Emily (Sistema Monarca) v11.26
            Esta versión nativa incluye:
            - 🎵 **Reproducción Inmediata desde Botones de Modo en Música MP3 (v11.26)**: Ahora al tocar **`Aleatorio`**, **`Inteligente`** o **`Todas / Repetir`** cuando la música está sin canción seleccionada o en pausa, comienza la reproducción de inmediato en ese modo (pista aleatoria en **Aleatorio**, tu canción #1 del Top en **Inteligente**, o inicio inmediato en **Repetir**) exactamente como pulsar **Play**, mientras que si ya está sonando música cambia el modo sin interrumpir la pista actual.
            - ⏱️ **Cronómetro Total de Rutina + Récord de Tiempo por Defecto + Guardián de Quests Obligatorias + Aprobación Remota de Implementation Plan (v11.25)**:
              - **Cronómetro de Duración Total de Rutina**: Mide automáticamente cuánto tardas en completar cada rutina de principio a fin (con pausa/reanudación, persistencia exacta con pantalla apagada, comparativa en vivo contra tu última sesión, mejor marca y promedio, indicador de si tus sesiones se hacen **más cortas** o **más largas**, historial desplegable con barras y chip de tiempo en las tarjetas de rutinas).
              - **Récord Automático de Tiempo por Defecto (Isométricos & Serie 0)**: Al superar tu marca de tiempo en ejercicios como `Plancha Abdominal` (Serie 0 o multi-serie), guarda automáticamente el nuevo tiempo por defecto en tu catálogo y en todas tus rutinas, actualizando las insignias a `s (MM:SS)` en lugar de `reps`.
              - **Guardián de Salida para Quests y Rutinas Obligatorias**: Al intentar salir sin terminar de una rutina vinculada a una quest obligatoria (incluso con `0%` de series hechas) o de cualquier quest diaria obligatoria activa (incluso pulsando el botón Atrás de Android), aparece el panel de alerta Dark Glass con penitencia, vista previa de EXP y motivo obligatorio.
              - **Auto-PC + Perfil · Implementation Plan & Respuestas Completas de Antigravity**: Auto-PC ahora frena la cola si Antigravity pide aprobar un `implementation_plan.md` (sin marcarla como terminada ni enviar la siguiente solicitud encima), dispara notificación en tu teléfono y muestra el plan completo + botones **`✅ Aprobar Plan (Proceed)`** / respuesta personalizada y las respuestas completas de Antigravity directamente en **Perfil**.
            - ⏱️ **Descanso Entre Series a 3 Minutos (`03:00`) por Defecto (v11.24)**: El contador de **Descanso Entre Series** en rutinas de entrenamiento ahora viene configurado en **3 minutos (`180s`)** por defecto (con el botón **`3m`** seleccionado junto a `30s`, `60s`, `90s` y `2m`), tanto en la barra superior de la rutina como en el panel inline que emerge entre cada serie/ejercicio y en las notificaciones con pantalla apagada (`"Finalizó tu descanso de 3 min"`).
            - 🛡️ **Blindaje Rutina ↔ Hábito Diario & Colores Dark Glass en Hábitos/Penitencias (v11.23)**: Corregido de raíz el conflicto que marcaba como **`💀 PENALIZADA`** una rutina ya completada en la mañana: ahora al finalizar una rutina se sella la fecha y timestamp del hábito vinculado, se registra en la gráfica de **Productividad**, se protege automáticamente contra expiración mientras estás entrenando, se **reconcilia al instante contra tu historial de hoy** (limpiando falsas penitencias y devolviendo la EXP deducida) y en la sincronización entre teléfono y PC el estado **`Completada hoy`** siempre prevalece sobre una alarma vencida en otro dispositivo. Además se corrigieron todos los problemas de color claro/blanco del cuadro **`PENITENCIAS ACTIVAS DEL SISTEMA`** y las insignias (`⏳ PENDIENTE`, `💀 PENALIZADA`, `✓ COMPLETADA`) migrando todo al tema **Monarca Dark Glass** totalmente legible.
            - 🗣️ **Nuevo Apartado de Vocabulario Semanal dentro de Conocimiento (v11.22)**: Ahora **📚 Conocimiento** se divide en **`📚 Técnicas & Estudio`** y **`🗣️ Vocabulario Semanal`** para entrenar las palabras que quieres incorporar cada semana: registra cada palabra con su significado, contexto (`Conversación`, `Profesional`, `Persuasión`, `Escritura`, `Precisión`), qué palabras comunes reemplaza (*"En lugar de decir..."*), frase de ejemplo real, botón **`✨ Sugerir`** con palabras de alto impacto, contador de usos reales **`🗣️ ¡La usé! (+1)`** (+EXP y graduación automática a **`⭐ Dominadas`**), reto rápido **`🎲 Palabra al Azar`**, cierre **`🔄 Nueva Semana`** y sincronización completa en la nube.
            - 📅 **Calendario Financiero Integrado en Planificación (v11.21)**: El **Calendario Cronológico de Cobros y Pagos** ahora forma parte del apartado **📋 Planificación** junto a **Cola de Pagos**, **Deudas** y **Metas** (con barra de 4 subpestañas en cuadrícula `2×2` limpia en móvil sin recortes y contador de pendientes en vivo), simplificando la navegación superior de Finanzas a **4 pestañas limpias** (`Resumen | Movimientos | Planificación | Tarjetas`).
            - ⚖️ **Regla 50 / 40 / 10 Exclusiva para Días de Cobro — 15 y Último de Cada Mes (v11.20)**: La **Regla 50/40/10**, su gráfica comparativa y la tarjeta **Meta 50% Inversión** ahora toman como base **únicamente tus cobros del día 15 y del último día de cada mes** (respetando automáticamente meses de 28, 29, 30 y 31 días y tus nóminas Boom Solutions), sin mezclarse jamás con ingresos sueltos de semanas intermedias. En semanas sin día de cobro muestra un aviso claro (`$0.00 · Sin cobro`) junto a píldoras rápidas (**`📅 Día 15`**, **`📅 Último`** y **`⚖️ 15 y Último`**) para consultar la distribución de cualquier día de cobro al instante.
            - 🏦 **Dinero Actual en Cuentas Persistente y Prioritario en Finanzas (v11.19)**: Se añadió en la parte superior de **Finanzas** (por encima de las pestañas y del selector semanal/mensual) el bloque prioritario **`🏦 DINERO ACTUAL EN CUENTAS`** que **siempre persiste intacto aunque cambies entre semanas (`Sem 1..5`), `Mes Completo`, meses o pestañas**: muestra tu saldo total real hoy en `$`, desglose en **Bolívares** y **USDT**, botón de privacidad `👁️`, acceso directo **`💳 Cuentas`** y chips interactivos de cada banco/billetera para ajustar o mover saldo en 1 toque.
            - ⏰ **Alertas de Eventos y Horario 30 Minutos Antes + Anti-Duplicados en Notificaciones (v11.18)**: Las notificaciones en la campana y las alarmas nativas del teléfono (incluso en segundo plano / pantalla apagada vía `LocalNotifications` con horizonte de 48h) ahora te avisan automáticamente **media hora antes** de cada **Evento del Calendario**, **bloque de tu Horario Semanal (Cronograma Base)** y **turno laboral Boom Solutions** con mensajes claros (`"En media hora en tu horario: ..."`, cuenta regresiva en vivo, botones **`✓ Okey`** y **`🗓️ Ver Horario`**). Además, los nuevos eventos y bloques de horario traen **30 minutos antes** como opción predeterminada, el Centro de Notificaciones lista los **próximos bloques y eventos de hoy** con insignia `⏰ Aviso 30m antes`, y se corrigió la duplicación de tarjetas de alertas de Auto-PC.
            - 🤖 **Monitoreo Preciso de Antigravity en Vivo, Resúmenes Desplegables en Hechas y Colores de Perfil (v11.17)**: El panel **Monitoreo Antigravity · Auto-PC** en **Perfil** ahora lee el progreso real del agente desde tu PC y muestra la **fase exacta** (`Analizar → Programar → Probar → Publicar`), **barra de avance con % y pasos**, **acción en curso**, **chips de archivos tocados**, **bitácora desplegable** y resumen rápido en ítems completados, eliminando falsas alertas de `"Sin latido"` y puliendo al 100% los colores oscuros de todo Perfil (Atributos, Monitoreo y Sincronización). Además, cuando una solicitud pasa a **Hechas** en **Ideas → Operatividad**, incluye una **barra desplegable informativa (`🤖 Resumen de Antigravity`)** con todo el resumen formateado, archivos modificados y botón **`📋 Copiar resumen`**.
            - 🎚️ **Barra de Reproducción Anti-Toques Accidentales en Reproductor MP3 (v11.16)**: Se reemplazó el `<input type="range">` hipersensible por un scrubber táctil inteligente que **jamás salta la canción por un roce accidental o al deslizar verticalmente** hacia la biblioteca; solo avanza o retrocede con un **arrastre horizontal intencional** (umbral anti-roce) o **manteniendo presionado (`0.26s`)**, muestra una **burbuja flotante con el tiempo exacto** (`01:42`) mientras deslizas y confirma el salto suavemente recién al soltar el dedo, además de mayor separación sobre los botones de reproducción.
            - 🎲 **Ruleta de Variabilidad Conectada a tus Playlists + Pulido de Finanzas (v11.15)**: La categoría **🎵 Música** de la **Ruleta de Variabilidad Semanal** ahora trabaja en tiempo real con las **Listas de Reproducción de tu Reproductor MP3** (sin listas genéricas quemadas): muestra el conteo real de canciones, permite **▶️ Escuchar** directo al girar o desde cada tarjeta, **activar/omitir** listas de la ruleta sin borrarlas del reproductor y se sincroniza automáticamente cuando creas o editas una playlist. Además, en **Finanzas** se añadió respaldo gráfico **Canvas 2D offline** para **Comparativa 50/40/10** y **Categorías** (adiós recuadro vacío sin internet), se pulió la alineación móvil de tarjetas de **Movimientos**, botones/filtros de **Cola de Pagos** y se eliminó el destello claro inicial de `#badge-balance-estado`.
            - ✨ **Pulido Integral UX/UI (Perfil, Metas, Inventario Móvil y Modales) (v11.14)**: Migración completa del **Centro de Sincronización Multi-Dispositivo** en **Perfil** a **Monarca Dark Glass** (eliminando las tarjetas y botones blancos con texto blanco ilegible), corrección de cascada CSS y rediseño v2 de **Metas de Ahorro** en **Finanzas → Planificación** (títulos nítidos, barra esmeralda, 3 métricas `Ahorrado | Faltante | Cuota`, conteo de cuotas restantes y estado celebratorio **`✅ 100% CUMPLIDA`**), nueva barra de **3 pestañas segmentadas en Inventario** (`Stock | Categorías | Vendidos`) totalmente visible en una sola fila en móvil sin recortar `Vendidos`, y modo oscuro unificado en checklists de modales.
            - ⏱️ **Contador de Descanso Inline Entre Series y Ejercicios (v11.13)**: El contador de descanso ya no queda escondido arriba de la pantalla — al marcar una serie hecha (incluyendo **Serie 0 · Modo Récord**), el panel emerge justo entre la serie/ejercicio recién terminado y el siguiente por hacer (`→ Serie 2` o `→ Sentadillas`), muestra los controles rápidos (`30s`, `60s`, `90s`, `120s`, `+15s`) y el aviso **`⚡ ¡A entrenar!`** en verde, desaparece de ahí al completar la siguiente serie y reaparece debajo de la nueva serie, conservando intactas las alertas nativas con pantalla apagada.
            - 🏋️ **Rutina Aleatoria Detallada por Grupo Muscular & Re-roll Estricto (v11.12)**: En **Personal Trainer → Rutina Aleatoria** y **Entrenamiento → Rutina Aleatoria Personal**, la sesión generada ahora reparte equitativamente los ejercicios y los organiza en bloques claros por cada grupo muscular (ej: **Pecho · 2**, **Tríceps · 2**, **Hombros · 2**), con resumen visual superior, etiquetas limpias, mensajes de WhatsApp agrupados por músculo y **🔄 Re-roll estricto** que siempre sustituye el ejercicio por otra variante del **mismo grupo muscular** (reconociendo acentos y sub-músculos como `Deltoides_Anterior` → Hombros o `Triceps_Lateral` → Tríceps).
            - 🎧 **Pausa Automática al Desconectar Audífonos Bluetooth/Cableados (v11.11)**: El motor nativo (`MonarcaMediaPlugin`) ahora escucha en tiempo real **`ACTION_AUDIO_BECOMING_NOISY`**, **`ACTION_HEADSET_PLUG`** y **`AudioManager.AudioDeviceCallback`** (Bluetooth A2DP, BLE Audio, USB-C y jack 3.5mm) — incluso con la app en segundo plano o pantalla apagada — pausando la música de inmediato (y actualizando mini-reproductor, rutina y pantalla de bloqueo) para que jamás se quede sonando por el altavoz del teléfono.
            - 📱 **Rediseño Limpio & Espacioso de Finanzas / Deudas en Móvil (v11.10)**: Banner compacto y desplegable para **Alertas de Retrasos** (sin torres largas de texto), pestañas principales de Finanzas en **1 sola línea deslizable**, subpestañas segmentadas más limpias, tarjetas de **Deudas** reestructuradas en 2 filas claras (sin textos aplastados en columnas angostas ni números repetidos), botones de acción full-width bien balanceados y corrección del botón eliminar `✕` al tema oscuro.
            - 📝 **Motivo de Rutina Incompleta & Guardián al Salir (v11.09)**: Al intentar salir de una rutina con ejercicios sin completar (`◀ VOLVER A EJERCICIOS`, gesto atrás en Android o cambiar de pestaña), Emily te muestra tu porcentaje de avance, las series faltantes, la penitencia exacta en EXP y te pregunta **¿Por qué no terminaste la rutina?** (chips rápidos + texto libre obligatorio para cerrar con penitencia, guardado en el resumen y en el historial, más opción de **pausar temporalmente** si solo vas a revisar otra sección).
            - 💀 **Penitencia en EXP por Series No Realizadas en Rutinas (v11.08)**: Si terminas una rutina incompleta, Emily calcula automáticamente cuántas series te faltaron entre todos los ejercicios y deduce **`-20 EXP × series faltantes`** (ej: 3 series sin hacer = **`-60 EXP`**, configurable por rutina o desactivable con `0`), mostrando vista previa en vivo, desglose por ejercicio antes de confirmar, registro en historial y sincronización blindada de EXP con Firebase. También corrige el contador de series en el HUD para ejercicios en Modo Serie 0.
            - ⏱️ **Notificación Exacta de Descanso con Pantalla Apagada (v11.07)**: Al iniciar el contador de **Descanso Entre Series** (`30s`, `60s`, `90s`, `120s` o al completar una serie), Emily programa una alarma nativa exacta en Android (`MonarcaRestTimerReceiver` vía `AlarmManager.setAlarmClock`) que despierta brevemente la pantalla, muestra la notificación **`⏱️ ¡Descanso terminado! ¡A entrenar!`**, vibra con patrón triple táctil y emite un aviso directo en tus audífonos Bluetooth/cableados si tienes el teléfono en silencio. Además, el contador ahora calcula el tiempo por reloj real (`finTimestamp`) para no congelarse jamás al apagar la pantalla.
            - ✨ **Inventario: Artículos Personales & Ventas Únicas (v11.06)**: Nuevo botón **`✨ + Venta Única`** para registrar cosas propias que quieres vender (tarjeta de vídeo, monitor, consola, repuesto...) sin crear categorías fijas, con condición, detalles, precio en `$` o `Bs.` (`BCV` / `Paralelo`), estado **`✅ Vendida`** y abono directo de ventas al contado hacia tus Tarjetas en Finanzas.
            - 💰 **Finanzas Inteligentes v11.05**: Corrección de falsos retrasos en pagos fijos mensuales (Boom Solutions Día 30), categoría **Préstamos** con conversión `Bs → $`, asignación y división multi-tarjeta, y **Deudas Flexibles** a tu ritmo sin cuotas fijas.
            - 🎲 **Rutina Aleatoria Personal, Settings Semanal Propio y Música (v11.04)**: En **Entrenamiento → Rutinas & Sesiones**, nuevo botón **`🎲 Rutina Aleatoria`** totalmente independiente de Personal Trainer: incluye **`⚙️ Settings (Mis Días)`** para configurar tus propios días y grupos musculares de la semana (`splitPersonal`), selector integrado de **playlist de música** al crear la rutina, botón **`💾 Guardar en Mis Rutinas`** y **`▶️ Iniciar Sesión Ahora`** con calentamiento, reproducción automática, registro de series/pesos y EXP idénticos a tus rutinas personales.
            - 🚨 **Alertas de Pagos/Cobros Retrasados y Reprogramación Masiva e Individual (v11.03)**: Banner de alerta automático en **Finanzas** y en la **campana de notificaciones** cada vez que tengas pagos, cuotas de deuda o cobros (incluyendo créditos de **Almacén**) vencidos antes de hoy; insignias **`🚨 Retrasado`** + botón **`📅 Reprogramar`** directo en Movimientos y Deudas, y ventana dedicada para reprogramarlos **todos juntos** o **cada uno** con fechas personalizadas.
            - 💬 **Enviar Rutina a WhatsApp por Mensajitos (v11.02)**: En **Personal Trainer → Rutina Aleatoria**, el botón **`📋 Asignar a Alumno`** se reemplaza por **`📤 Enviar Rutina`**; al pulsarlo se abre una ventana que divide la rutina generada en mensajes cortos al estilo natural de WhatsApp (**`Mensaje 1`**, **`Mensaje 2`**, **`Mensaje 3`**...), con botón **`📋 Copiar`** individual (marca visual `✓ Copiado`), **`📋 Copiar Todo`** y acceso directo **`💬 Abrir WhatsApp`**.
            - 🧹 **Enfoques Limpio, Vaciar Horario & Sin Reaparición de Plantillas (v11.01)**: Interfaz de **Enfoques** mucho más compacta y despejada (selector rápido por atleta en vivo sin repetir tarjetas ni saturar la pantalla, filas de ejercicios más limpias y selector de mes en una sola línea), eliminación real hasta quedar vacío (`0` rutinas cuando no trabajas de Trainer sin que vuelvan las 6 rutinas por defecto) y botón **`🧹 Vaciar`** para limpiar el horario al instante.
            - 🎯 **Enfoques Multi-Atleta en Vivo + Rutinas Aleatorias Integradas (v11.00)**: Cada rutina aleatoria que asignas, guardas o inicias aparece de inmediato dentro de **Enfoques** con su atleta, grupos musculares y lista de ejercicios; permite mantener **1, 2, 3 o más rutinas rodando al mismo tiempo** con cronómetro individual, seleccionar cualquiera para ver sus músculos/ejercicios y marcar hechos vs. faltantes en vivo.
            - 🏋️‍♂️ **Personal Trainer Limpio + Rutina Aleatoria con Settings y Sorteo en Descanso (v10.99)**: Rediseño luminoso y sin bordes opacados en todo el módulo de **Personal Trainer** (cabecera compacta, KPIs legibles y pestañas en 1 línea), botón destacado **`⚙️ Settings`** para configurar músculos por día (Lunes–Domingo) y generación aleatoria real que sortea músculos de tu configuración incluso cuando pides rutina en día de descanso.
            - 📅 **Calendario Unificado (Labores + Quests + Personas + Finanzas) y Fix Móvil (v10.98)**: Todo converge ahora en **Mi Calendario** con capas filtrables (`🌐 Todas`, `👤 Personal`, `💼 Labores`, `⚔️ Quests`, `💰 Finanzas`), marca directa de jornadas Boom (`8.0h` / `⚙️ Sábados`), citas de Barbería/Trainer, Quests Diarios por hora, fechas de Personas y cobros/pagos/compras Finanzas; se eliminaron los 3 calendarios duplicados dentro de Labores y se corrigió el desbordamiento horizontal en pantallas móviles.
            - 🔄 **Sincronización en Tiempo Real y Envío Directo APK → Auto-PC (v10.97)**: Corrección de tombstones numéricos (`Number` vs `String`) y desfase de reloj para reflejar al instante eliminaciones y ediciones entre Laptop y Teléfono sin resucitar ítems, nuevo plugin nativo `MonarcaLocalBridge` (autodescubrimiento UDP `47622` + envío directo HTTP LAN por Wi-Fi sin gastar cuota Firebase), reintentos activos por nube cuando estás fuera de casa y refresco automático al volver a primer plano.
            - 📅 **Corrección de Colores Oscuros en Calendario & Agenda Táctica (v10.96)**: Eliminación de botones blancos heredados (`.btn-sync-light` en `Ver Cuadrícula Horaria`, `+ Recordatorio`, `+ Evento`, `+ Destacado` y `Cerrar & Reiniciar`) y borde blanco en el modal de transición de jornada.
            - 🚀 **Auto-PC Marcado por Defecto al Crear Idea (v10.95)**: La casilla **`Empezar a programar en Auto-PC al crear`** ahora viene activada por defecto en **Banco de Ideas** y **Asistente Rápido** cuando eliges **✨ Emily** (manteniéndose activa tras publicar, lista para desmarcarla solo cuando no la necesites).
            - 🎲 **Tema Oscuro Completo en Ruleta de Variabilidad (v10.94)**: Eliminación de bordes blancos (`#e5e7eb` / `#f3f4f6`), rueda vacía clara y divisores claros en banner, banco de opciones, lienzo y modal.
            - 💼 **Labores reorganizado para móvil (v10.93)**: KPI grid simétrico `2×2`, pestañas segmentadas (**`Sub-Apps | Análisis | Historial`**), gráfica Chart.js con desglose por labor y filas de historial compactas.
            - 🌙 **Corrección de Contraste Oscuro en Personas, Conocimiento y Ruleta**: Eliminación de tarjetas blancas heredadas (`weekly-review-banner`, `knowledge-card`, píldoras de ubicación/estado y botones de acción) unificadas al tema oscuro Monarca.
            - 🤖 **Puente Directo & Lote Auto-PC anti-429 (v10.91)**: Nuevo botón **`📤 Enviar a PC`** en Programación & Nuevas Funciones para enviar solicitudes e imágenes directo a Auto-PC o copiarlas como lote JSON al instante si Firebase alcanza su límite diario 429.
            - 🏆 **Top Canciones Más Escuchadas & Modo Inteligente (v10.90)**: Nuevo apartado de Top de reproducciones en tiempo real y modo **Inteligente** en playlists y controles para reproducir tus canciones ordenadas de la más escuchada (#1) a la menos escuchada.
            - 🎵 **Detección de Música Nueva en Reproductor MP3 (v10.89)**: Al entrar al reproductor, detecta canciones recién añadidas o descargadas (SnapTube/MediaStore), muestra una alerta con sugerencias inteligentes de playlist (Entrenamiento, Salsa, Llaneras, etc.) y vuelve al reproductor normal al terminar.
            - 🏋️ **Series Desplegables con Flechita por Ejercicio (v10.88)**:
              - Cada tarjeta de ejercicio en la sesión de entrenamiento incorpora una flecha desplegable (`▾` / `▸`) y botón global **Desplegar todas / Contraer todas** para retraer o expandir a detalle sus series.
