name: Compilar APK Android de Sistema Monarca

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generar APK Nativa Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 4. Instalar dependencias npm
        run: npm install

      - name: 5. Preparar directorio web www/ y compilar Capacitor Bridge
        run: |
          mkdir -p www
          cp index.html style.css www/
          cp -r js icons www/
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f version.json ] && cp version.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          [ -f app.js ] && cp app.js www/ || true
          npx esbuild js/capacitor-bridge-entry.js --bundle --minify --outfile=www/js/capacitor-bridge.js
          echo "Archivos web y Capacitor Bridge compilados en www/ exitosamente"

      - name: 6. Añadir plataforma Android de Capacitor
        run: npx cap add android || true

      - name: 7. Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: 8. Inyectar Componentes Nativos de Alarma Despertador a Pantalla Completa (Java)
        run: python3 scripts/configure_android.py

      - name: 9. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Sistema-Monarca.apk

      - name: 10. Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Monarca-APK
          path: Sistema-Monarca.apk
          retention-days: 30

      - name: 11. Publicar Release con la APK para descarga directa en móvil
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Sistema Monarca · Emily (APK Nativa Android v10.94)"
          body: |
            ### 📱 APK Nativa de Emily (Sistema Monarca) v10.94
            Esta versión nativa incluye:
            - 🎲 **Tema Oscuro Completo en Ruleta de Variabilidad (v10.94)**: Eliminación de bordes blancos (`#e5e7eb` / `#f3f4f6`), rueda vacía clara y divisores claros en banner, banco de opciones, lienzo y modal.
            - 💼 **Labores reorganizado para móvil (v10.93)**: KPI grid simétrico `2×2`, pestañas segmentadas (**`Sub-Apps | Análisis | Historial`**), gráfica Chart.js con desglose por labor y filas de historial compactas.
            - 🌙 **Corrección de Contraste Oscuro en Personas, Conocimiento y Ruleta**: Eliminación de tarjetas blancas heredadas (`weekly-review-banner`, `knowledge-card`, píldoras de ubicación/estado y botones de acción) unificadas al tema oscuro Monarca.
            - 🤖 **Puente Directo & Lote Auto-PC anti-429 (v10.91)**: Nuevo botón **`📤 Enviar a PC`** en Programación & Nuevas Funciones para enviar solicitudes e imágenes directo a Auto-PC o copiarlas como lote JSON al instante si Firebase alcanza su límite diario 429.
            - 🏆 **Top Canciones Más Escuchadas & Modo Inteligente (v10.90)**: Nuevo apartado de Top de reproducciones en tiempo real y modo **Inteligente** en playlists y controles para reproducir tus canciones ordenadas de la más escuchada (#1) a la menos escuchada.
            - 🎵 **Detección de Música Nueva en Reproductor MP3 (v10.89)**: Al entrar al reproductor, detecta canciones recién añadidas o descargadas (SnapTube/MediaStore), muestra una alerta con sugerencias inteligentes de playlist (Entrenamiento, Salsa, Llaneras, etc.) y vuelve al reproductor normal al terminar.
            - 🏋️ **Series Desplegables con Flechita por Ejercicio (v10.88)**:
              - Cada tarjeta de ejercicio en la sesión de entrenamiento incorpora una flecha desplegable (`▾` / `▸`) y botón global **Desplegar todas / Contraer todas** para retraer o expandir a detalle sus series.
              - Chip en vivo de progreso por ejercicio (`0/3 series`, `✓ 1/1 hecha`), compatibilidad intacta con `Detalle` y persistencia automática en la sesión activa.
            - 🔔 **Cero Reaparición de Notificaciones Ya Hechas o Confirmadas (v10.87)**:
              - Corregida la pérdida de historial descartado (`notificacionesAutoPC`) durante la fusión inteligente en Firestore al sincronizar entre computadora y teléfono.
              - Confirmar con **`✓ Okey`** / **`✓ Okey a todas`**, o marcar/eliminar una idea como **Hecha**, sella permanentemente la solicitud tanto localmente como en la nube (`notifConfirmada`) para que nunca se vuelva a acumular ni a recargar.
              - Blindados también los sellos de actualización al confirmar alertas de **Quests** y avisos generales de sesión.
            - 🧍 **Estado Personal & Gráficas Radar Optimizadas en Móvil (v10.86)**:
              - Restaurada la silueta anatómica dual (**ANTERIOR · FRENTE** + **POSTERIOR · ESPALDA**) en móvil desde la carga inicial de **Estado Personal**, con encuadre ampliado, divisor central y cabeceras alineadas.
              - Gráficas radar de **Biometría Muscular** y **Telemetría Neural** rediseñadas con etiquetas multilínea sin recortes ni deformación del polígono, badges que no se parten y respaldo Canvas 2D nítido también en modo offline.
              - Pestañas superiores y de telemetría adaptadas en 3 columnas limpias en móvil sin textos cortados (`⚡ Desgaste`, `🥗 Nutrición`, `🌙 Descanso`).
            - 💪 **Catálogo de Ejercicios Limpio & Legible (v10.85)**:
              - Eliminado el recorte con `...` en los nombres de ejercicios y las etiquetas partidas en dos líneas en **Arsenal Físico**; ahora muestran nombre completo, modalidad, series/reps, carga e implemento en chips claros.
              - Barra horizontal deslizable de categorías musculares y cognitivas en móvil para aprovechar mucho mejor el espacio vertical.
            - 🏋️ **Tarjetas de Ejercicios Limpias & Organizadas en Rutinas (v10.84)**:
              - Rediseño visual sin cajas anidadas ni información repetida; el botón **`✓ Marcar Hecha`** y las etiquetas de fatiga se ajustan limpiamente en móvil sin recortarse.
              - Cabeceras con chips limpios (Serie 0 / Récord / Corporales / Pesos) y controles de series alineados.
            - 🎧 **Audio & Playlist Inteligente en Rutinas (v10.83)**:
              - Rediseño limpio de la tarjeta de playlist dentro de cada rutina (sin botones repetidos arriba, mostrando claramente la playlist activa).
              - Cualquier playlist que escojas dentro de una rutina se guarda automáticamente **por defecto** para tus próximas sesiones.
              - Transición progresiva (**fade-in** suave al iniciar la rutina y **fade-out** gradual al terminarla) y **reanudación suave** de la canción que estaba sonando antes si fue interrumpida por la rutina.
            - 📊 **Panel Desplegable con Gráfica en Hábitos & Misiones (v10.82)**:
              - Reemplazadas las cajas numéricas apiladas (`Completadas`, `En curso`, `Penitencias`) por una **gráfica visual interactiva** (anillo + barras proporcionales) dentro de un **panel desplegable** compacto para no estorbar la vista principal de misiones.
            - 🎶 **Botón completo en Agregar Canciones a la Lista (v10.81)**:
              - Corregido el recorte vertical del pie de modal (`✓ Guardar en Lista`) dentro del Reproductor MP3 en pantallas móviles cuando la lista tiene muchas canciones.
            - 🔔 **Notificaciones unificadas Centro de Alertas ↔ Teléfono con `✓ Okey` (v10.80)**:
              - Todas las notificaciones (Auto-PC, Recordatorios de Calendario, Eventos y Quests/Penitencias) aparecen sincronizadas tanto en **Centro de Alertas & Notificaciones** como en las **notificaciones nativas de tu teléfono**.
              - Nuevo botón **`✓ Okey`** tanto en las tarjetas del Centro de Alertas como en la notificación del teléfono (Android / PWA) para confirmar y limpiar ambos lados a la vez sin duplicados.
            - 🤖 **Monitoreo en vivo de Auto-PC dentro de Perfil (v10.79)**:
              - Nuevo recuadro de estado en **Perfil** que muestra en tiempo real si **Auto-PC** está trabajando en tu proyecto, el latido de la PC, la solicitud en curso con cronómetro, conteos de cola (`En curso`, `En cola`, `Listas`) y alertas si está en pausa, sin ventana de Antigravity o posiblemente trabado.
            - 🎧 **Auto-actualización automática en el Reproductor MP3 (v10.78)**:
              - Eliminado el botón manual de actualizar/escanear lista en la biblioteca del reproductor.
              - Cada vez que entras en el reproductor MP3 (o regresas a él desde SnapTube/descargas), escanea e indexa automáticamente tus canciones nuevas al instante sin interrumpir la canción actual.
            - 🔔 **Recordatorios rápidos desde el Asistente Monarca (v10.77)**:
              - Nuevo apartado **`🔔 Recordatorio`** junto a **`💰 Finanza`** y **`💡 Idea`** dentro de **Captura Rápida (`+`)**.
              - Incluye los mismos campos del **Calendario** (**Nombre del Recordatorio**, **Fecha**, **Hora Exacta (Alarma)**, **Vincular Persona** desde Personas y **Descripción / Nota**), sincronizándose de inmediato con Calendario, Centro de Alertas y alarmas nativas Android.
            - 🖼️ **Adjuntar Fotos, Capturas e Imágenes en Ideas + Envío a Auto-PC (v10.76)**:
              - Opción de adjuntar una **foto tomada al momento (cámara)**, una **captura de pantalla**, **imagen de galería** o **pegar del portapapeles** tanto en **Banco de Ideas** como en **Captura Rápida** (`+` Asistente Monarca).
              - Si creas una idea en **`✨ Emily`** con imagen/captura y activas **Empezar a programar en Auto-PC**, tu PC adjuntará automáticamente la captura junto al texto dentro de **Antigravity**.
            - 🔔 **Alertas en Centro de Notificaciones al completar Auto-PC (v10.75)**:
              - Cada vez que una solicitud termina (`LISTA`) en tu **Auto-PC**, aparece una notificación dedicada en **🔔 Centro de Alertas & Notificaciones** confirmando que la solicitud ya fue añadida (compatible con todas tus solicitudes y con limpieza individual o grupal).
            - 🤖 **Conexión en vivo Ideas `✨ Emily` ↔ Auto-PC (v10.73–v10.74)**:
              - Al crear o ver ideas en **`✨ Emily`** (tanto desde **Banco de Ideas** como desde el botón **`+` Asistente Rápido**), decide si enviarlas de una vez (o luego) a la cola de **Auto-PC** (`Work Antigravity`), observa en tiempo real cuando entran en programación y deja que se marquen automáticamente como **`✓ Hecha`** (+15 EXP) al terminar en tu computadora.
            - 🔍 **Detector de Actualizaciones en Home (v10.72)**:
              - Compara automáticamente la versión instalada en tu teléfono contra la última versión publicada en GitHub (APK / Web), detallando si estás al día o si tienes cambios nuevos pendientes por descargar con botón directo.
            - 🏠 **Apartado Home como pantalla inicial (v10.70–v10.71)**:
              - Al abrir la aplicación arranca directamente en **Home** (`#vista-home`) con la **fecha actual** destacada en calendario del día, día de semana, **hora en vivo** (`HH:MM:SS AM/PM`), saludo según hora y acceso rápido a tus **Apps**.
            - ✨ **Rediseño Limpio y Modular de Finanzas (v10.68–v10.69)**:
              - Cabecera compacta con indicador rápido de Tasas (`BCV` / `Paralelo`) desplegable bajo demanda y selector semanal compacto en una sola línea (**`◀ Sem X ▶`** + **`Mes Completo`**).
              - Separación clara en **5 pestañas enfocadas**: **`Resumen`** (KPIs reales del período + gráfico y Regla 50/40/10 unificados sin duplicaciones), **`Movimientos`** (Ingresos y Gastos del día a día), **`Planificación`** (sub-pestañas organizadas para *Cola de Pagos*, *Deudas & Cuotas* y *Metas*), **`Tarjetas`** y **`Calendario`**.
              - Selector de semanas envolvente (sin cortar **`Mes Completo`**) y cálculo preciso de cuotas pagadas dentro del período activo.
            - 📋 **Apartado Planificación de Pagos en Finanzas (v10.67)**:
              - Tablero unificado que cruza lo que ya llevas **cobrado / en tarjetas** con tus **Gastos Programados**, **Deudas activas** y **Compras / Pagos Planeados** ordenados por prioridad.
              - Simulación en vivo de alcance (**`Te alcanza completo`**, **`Puedes abonar`** o **`Esperando cobro`**) más botones directos para **Abonar por partes**, **Pagar Completo** o **Comprar** (descontando opcionalmente en `Bs.` o `$` desde tus tarjetas **Provincial**, **Venezuela**, **Binance** o **Todoticket** con historial y reversión `↩`).
            - 💳 **Apartado Tarjetas en Finanzas con tasa viva y control de devaluación (v10.66)**:
              - Bancos/plataformas disponibles estrictamente configurados: **Provincial**, **Venezuela**, **Binance** y **Todoticket**.
              - Saldos en **Bolívares (`Bs.`)** recalibrados automáticamente cada vez que actualiza `ve.dolarapi.com` (`BCV USD`, `Euro BCV` y `Paralelo`) para reflejar al instante su equivalente real hoy en `$ USD` y medir cuánto se ha devaluado frente al dólar desde tu ingreso.
              - Saldo en **`$ USDT`** para **Binance** protegido contra la devaluación en Bs., además de asociación directa al cobrar ingresos o marcar pagos de gastos.
            - 🏋️ **Rutinas móviles y Playlist específica por rutina (v10.65)**:
              - Cada tarjeta de rutina ahora incluye su propio **selector directo de Playlist** (puedes elegir una lista distinta para cada rutina, usar la global por defecto o dejarla sin música con guardado instantáneo).
              - Rediseño móvil limpio para **Entrenamiento & Rutinas**: iconos vectoriales SVG, código (`RUT-1`), badge (`SESIÓN · FUERZA` con acentos intactos), título completo sin aplastamientos y botones táctiles claros (**`Iniciar sesión ›`**).
            - 🌿 **Árbol de Habilidades & Skills optimizado para teléfono (v10.64)**:
              - Tarjetas responsivas donde el rango (`RANGO E..SSS`) y el nombre completo se leen sin cortes ni truncamientos (`J...`).
              - Mini-HUD resumen con total de habilidades, horas invertidas y rango líder, botones táctiles **`+1h` / `+2h` / `+3h`** equilibrados y ruta visual desplegable de progresión **`E → SSS`**.
              - Gráfica **Inversión de Tiempo** proporcionada y limpia (sin bloques gigantes cuando hay pocas habilidades) con etiquetas legibles en móvil.
            - 🖤 **Reproductor Executive Noir B&N + SnapTube por defecto (v10.63)**:
              - Detección filtrada para mostrar **solo tus canciones de SnapTube por defecto** (con botón rápido si alguna vez quieres ver otras carpetas) y exclusión de grabaciones (`SoundRecorder`) y audios de `WhatsApp`/`Telegram`.
              - Filtro **blanco y negro (`grayscale`)** en todas las portadas y miniaturas para una estética nocturna uniforme y sin saturación de colores.
              - Controles vectoriales SVG minimalistas, botón central Play/Pause platino, barra de progreso rellena y tarjetas de pista mucho más limpias para títulos y artistas.
            - 🎧 **Biblioteca Musical Automática estilo Lark Player (v10.62)**:
              - Detección nativa instantánea desde Android (`MediaStore` vía `MonarcaMediaPlugin`) sin duplicar archivos ni tener que volver a subir canciones tras actualizar o reinstalar la APK.
              - Portadas reales cuadradas en el reproductor, miniaturas en la lista y mini-reproductor flotante, nombre real, artista/autor y resplandor ambiental adaptado a cada carátula.
              - Conservación automática de Playlists y tonos personalizados tras reinstalar o sincronizar con la nube mediante firmas estables de pista.
            - 🔔 **Alarma rediseñada, Rutinas con hora exacta/countdown y Notificaciones no bloqueantes (v10.61)**:
              - Pantalla de Alarma renovada con estética nocturna Emily OS, reloj en vivo AM/PM y controles claros.
              - Rutinas diarias con indicador en vivo (`06:00 AM (sonará en X)`), activación puntual con WakeLock nativo/reseteo diario fiable y tarjetas optimizadas para teléfono.
              - Recordatorios del Calendario mostrados como aviso flotante superior no bloqueante (se pueden cerrar sin perder su estado pendiente en 🔔 Notificaciones).
              - Nuevo diseño para Listas de Reproducción creadas y selector visual multi-canción sin ventanas emergentes nativas.
            - 🎨 **Nuevo Icono Oficial y Pantalla de Carga de Emily (v10.60)**: reemplazado el icono por defecto de Capacitor por el emblema oscuro **`✦`** de Emily (iconos adaptativos Android, mipmaps HD y splash oscuro). *(Si Play Protect muestra aviso por APK externa, toca **"Instalar de todas formas"**).*
            - 🏦 **Tasas Oficiales BCV & Euro en Finanzas (v10.59)**: conexión diaria automática con `ve.dolarapi.com/v1/cotizaciones`, caché local offline y conversor rápido USD / EUR / Bolívares.
            - 📅 **Calendario Integral (4 Apartados) & Grupos en Personas (v10.58)**:
              - 🔔 **Recordatorios** con hora exacta, persona vinculada, alerta visual/sonora, acción **Completado** y limpieza total del Centro de Notificaciones.
              - 📆 **Eventos** con cálculo automático de hora fin, detección de choques horarios y multi-selección de Personas y Grupos.
              - ⭐ **Días Destacados** con repetición anual, resaltado en calendario y banners superiores.
              - 🕒 **Cronograma Semanal** en cuadrícula horaria con prioridad visual automática para Eventos sin alterar semanas futuras.
            - 🎵 **Música Automática Continua en Rutinas (v10.57)**: elige tu playlist por defecto para entrenamientos y reprodúcela en orden aleatorio continuo sin pausas hasta finalizar tu rutina.
            - 💡 **Captura Rápida de Ideas sincronizada (v10.56)**: incluye la categoría **✨ Emily** y las subcategorías dinámicas del Banco de Ideas sin campo de detalle innecesario.
            - 📅 **Calendario Cronológico de Cobros y Pagos en Finanzas (v10.55)**: visualización por día con picos de cobros/pagos y reprogramación de fechas.
            - 🛡️ **Persistencia Blindada y Sincronización Cloud (v10.54)**: recuperación automática ante saturación de `localStorage`, cola segura ante arranque/offline y `flush` automático al cerrar/minimizar.
            - ⏰ **Alarma despertadora real (`MonarcaAlarmService`)** y 🎵 **Controles multimedia en barra de notificaciones**.
            - ⚡ Acceso a todos los módulos: Inventario, Finanzas, Quests Diarios, Hábitos, Entrenamiento, Reproductor y Jarvis Voz.

            **Instrucciones para instalar en tu teléfono:**
            1. Toca el archivo adjunto `Sistema-Monarca.apk` abajo para descargarlo.
            2. Ábrelo en tu teléfono para instalarlo / actualizarlo (permite orígenes desconocidos si tu teléfono te lo solicita).
            3. Abre Emily → Hábitos & Misiones → **🩺 Diagnóstico** y activa los permisos recomendados para asegurar la alarma con pantalla apagada.
          files: Sistema-Monarca.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
