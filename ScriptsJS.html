<script>
    // ==========================================================================
    // CONTROLADOR CLIENTE (SISTEMA DEL MONARCA - SOLO LEVELING)
    // ==========================================================================

    // Estado global de la aplicación en el cliente (Caché local en memoria)
    var APP_STATE = {
        cargado: false,
        jugador: null,
        perfil: null,
        misiones: null,
        habilidades: null,
        fatiga: null,
        gym: null,
        salud: null,
        finanzas: null,
        ideas: null,
        ejercicios: null,
        rutinas: null
    };

    // --------------------------------------------------------------------------
    // INICIALIZACIÓN DEL SISTEMA
    // --------------------------------------------------------------------------
    window.onload = function() {
        cargarSistemaCompleto();
    };

    /**
     * Carga todo el estado del sistema en una sola llamada de red ultrarrápida.
     */
    function cargarSistemaCompleto() {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) {
                    APP_STATE.cargado = true;
                    APP_STATE.jugador = res.jugador;
                    APP_STATE.perfil = res.perfil;
                    APP_STATE.misiones = res.misiones;
                    APP_STATE.habilidades = res.habilidades;
                    APP_STATE.fatiga = res.fatiga;
                    APP_STATE.gym = res.gym;
                    APP_STATE.salud = res.salud;
                    APP_STATE.finanzas = res.finanzas;
                    APP_STATE.ideas = res.ideas;
                    APP_STATE.ejercicios = res.ejercicios || [];
                    APP_STATE.rutinas = res.rutinas || [];

                    // Renderizar componentes principales
                    renderizarJugador(APP_STATE.jugador);
                    renderizarBarrasFatiga(APP_STATE.fatiga);
                } else {
                    // Fallback a llamadas individuales si la carga masiva falla
                    actualizarTodo();
                }
            })
            .withFailureHandler(function(error) {
                console.warn("Fallo en carga inicial por lotes, usando llamadas estándar:", error);
                actualizarTodo();
            })
            .obtenerEstadoInicial();
    }

    // --------------------------------------------------------------------------
    // NAVEGACIÓN ENTRE VISTAS
    // --------------------------------------------------------------------------
    function cambiarVista(vistaId) {
        var tabs = document.getElementsByClassName('tab-content');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove('active');
        }
        
        var vistaActiva = document.getElementById(vistaId);
        if (vistaActiva) {
            vistaActiva.classList.add('active');
        }

        // Renderizado instantáneo desde memoria si ya está cargado
        switch(vistaId) {
            case 'vista-menu':
                if (APP_STATE.jugador) renderizarJugador(APP_STATE.jugador);
                else actualizarTodo();
                break;
            case 'vista-perfil':
                cargarPerfil();
                break;
            case 'vista-estado-personal':
                cargarEstadoPersonal();
                break;
            case 'vista-misiones':
                cargarMisiones();
                break;
            case 'vista-habilidades':
                cargarHabilidades();
                break;
            case 'vista-gym':
                cargarGym();
                break;
            case 'vista-mente':
                cargarMente();
                break;
            case 'vista-finanzas':
                cargarFinanzas();
                break;
            case 'vista-ideas':
                cargarIdeas();
                break;
            case 'vista-calendario':
                renderizarCalendario();
                break;
            case 'vista-detalle-rutina-dinamica':
                // La vista ya fue preparada antes de la llamada, no hay que recargar
                break;
        }
    }

    // --------------------------------------------------------------------------
    // JUGADOR Y PERFIL
    // --------------------------------------------------------------------------
    function renderizarJugador(datos) {
        if (!datos) return;
        var tituloElem = document.getElementById('player-title');
        var nivelElem = document.getElementById('player-level');
        var titulo = (datos.titulo && !datos.titulo.toLowerCase().includes("monarca")) ? datos.titulo : "Gabriel Arias";
        if (tituloElem) tituloElem.innerText = titulo;
        if (nivelElem) nivelElem.innerText = "Nivel: " + (datos.nivel || 1) + " · Progreso EXP: " + (datos.exp || 0) + " / " + (datos.expMax || 100);
    }

    function actualizarTodo() {
        google.script.run
            .withSuccessHandler(function(datos) {
                APP_STATE.jugador = datos;
                renderizarJugador(datos);
            })
            .withFailureHandler(function(err) {
                console.error("Error al obtener jugador:", err);
            })
            .getDatosJugador();
    }

    function cargarPerfil(forzarRefresco) {
        if (APP_STATE.perfil && !forzarRefresco) {
            renderizarPerfil(APP_STATE.perfil);
            return;
        }
        google.script.run
            .withSuccessHandler(function(perfil) {
                APP_STATE.perfil = perfil;
                renderizarPerfil(perfil);
            })
            .withFailureHandler(function(err) {
                document.getElementById('contenedor-perfil').innerHTML = "<p style='color:#ef4444;'>Error cargando perfil: " + err.message + "</p>";
            })
            .getPerfilJugador();
    }

    function renderizarPerfil(perfil) {
        var p = perfil || { str: 10, int: 10, vit: 10, mp: 100 };
        var html = `<table>
            <tr><th>Atributo</th><th>Valor</th></tr>
            <tr><td>Fuerza (STR)</td><td><strong style="color:#60a5fa;">${p.str || 10}</strong></td></tr>
            <tr><td>Inteligencia (INT)</td><td><strong style="color:#60a5fa;">${p.int || 10}</strong></td></tr>
            <tr><td>Vitalidad (VIT)</td><td><strong style="color:#60a5fa;">${p.vit || 10}</strong></td></tr>
            <tr><td>Maná (MP)</td><td><strong style="color:#fbbf24;">${p.mp || 100}</strong></td></tr>
        </table>`;
        var cont = document.getElementById('contenedor-perfil');
        if (cont) cont.innerHTML = html;
    }

    // --------------------------------------------------------------------------
    // MISIONES Y HÁBITOS
    // --------------------------------------------------------------------------
    function cargarMisiones(forzarRefresco) {
        if (APP_STATE.misiones && !forzarRefresco) {
            renderizarMisiones(APP_STATE.misiones);
            return;
        }
        google.script.run
            .withSuccessHandler(function(misiones) {
                APP_STATE.misiones = misiones;
                renderizarMisiones(misiones);
            })
            .withFailureHandler(function(err) {
                document.getElementById('contenedor-misiones').innerHTML = "<p style='color:#ef4444;'>Error cargando misiones: " + err.message + "</p>";
            })
            .getMisiones();
    }

    function renderizarMisiones(misiones) {
        var html = "";
        if (misiones && misiones.length > 0) {
            misiones.forEach(function(m) {
                var esCompletado = m.estado === "Completado";
                var estiloTarjeta = esCompletado 
                    ? "background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(30, 41, 59, 0.4) 100%); border: 1px solid #334155; opacity: 0.75;" 
                    : "background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%); border: 1px solid #fbbf24; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.15);";
                
                var estiloBoton = esCompletado 
                    ? "background-color: #334155; color: #94a3b8; border: 1px solid #475569; cursor: not-allowed; box-shadow: none;" 
                    : "background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; border: 1px solid #60a5fa; cursor: pointer; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);";
                
                var textoBoton = esCompletado ? "✓ Completado" : "Completar";
                var accionClick = esCompletado ? "" : `onclick="marcarCompletado(${m.fila})"`;

                html += `
                <div style="${estiloTarjeta} border-radius: 12px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease;">
                    <div style="flex-grow: 1; padding-right: 15px;">
                        <div style="color: #f8fafc; font-weight: bold; font-size: 16px; margin-bottom: 6px; letter-spacing: 0.5px;">
                            <span style="color: #fbbf24; font-size: 13px; background: rgba(251, 191, 36, 0.1); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.3); margin-right: 8px;">[${m.frecuencia}]</span> 
                            ${m.nombre}
                        </div>
                        <div style="color: #94a3b8; font-size: 13px; display: flex; align-items: center; gap: 10px;">
                            <span style="color: #fbbf24;">+${m.exp} EXP (${m.atributo})</span>
                            <span style="color: #475569;">|</span>
                            <span>Racha: <strong style="color: #60a5fa; background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.2);">${m.diasRestantes} días</strong></span>
                        </div>
                    </div>
                    <div>
                        <button style="border-radius: 8px; padding: 10px 20px; font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; ${estiloBoton}" ${accionClick}>
                            ${textoBoton}
                        </button>
                    </div>
                </div>`;
            });
        } else {
            html = "<p style='text-align: center; color: #94a3b8; padding: 20px;'>No hay misiones activas en el sistema.</p>";
        }
        var cont = document.getElementById('contenedor-misiones');
        if (cont) cont.innerHTML = html;
    }

    function marcarCompletado(fila) {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.subioNivel) {
                    alert("¡LEVEL UP! Has subido al Nivel " + res.nuevoNivel + ". Tus estadísticas se han incrementado.");
                }
                cargarMisiones(true);
                actualizarTodo();
            })
            .withFailureHandler(function(err) {
                alert("Error al completar misión: " + err.message);
            })
            .completarMision(fila);
    }

    // --------------------------------------------------------------------------
    // HABILIDADES
    // --------------------------------------------------------------------------
    function cargarHabilidades(forzarRefresco) {
        if (APP_STATE.habilidades && !forzarRefresco) {
            renderizarHabilidades(APP_STATE.habilidades);
            return;
        }
        google.script.run
            .withSuccessHandler(function(skills) {
                APP_STATE.habilidades = skills;
                renderizarHabilidades(skills);
            })
            .withFailureHandler(function(err) {
                document.getElementById('contenedor-habilidades').innerHTML = "<p style='color:#ef4444;'>Error: " + err.message + "</p>";
            })
            .getHabilidades();
    }

    function renderizarHabilidades(skills) {
        var html = "";
        if (skills && skills.length > 0) {
            skills.forEach(function(s) {
                var porcentaje = Math.min(Math.max(s.porcentaje, 0), 100);

                html += `
                <div class="skill-card">
                    <div class="skill-card-header">
                        <div>
                            <span class="skill-rank-badge">${s.rango}</span>
                            <h3 class="skill-name">${s.nombre}</h3>
                        </div>
                        <button onclick="sumarHora(${s.fila})" class="btn-add-hora">
                            +1 Hora
                        </button>
                    </div>

                    <div class="skill-progress-track">
                        <div class="skill-progress-fill" style="width: ${porcentaje}%;"></div>
                    </div>

                    <div class="skill-progress-info">
                        <span>Progreso: <strong>${s.horasEnNivel} / ${s.horasReqNivel} hrs</strong> &nbsp;·&nbsp; Total: ${s.horasTotales} hrs</span>
                        <span>${s.infoSiguiente} (${porcentaje}%)</span>
                    </div>
                    <div class="skill-benefit-row">
                        🎁 <em>Beneficio:</em> ${s.beneficio}
                    </div>
                </div>`;
            });
        } else {
            html = "<p style='text-align: center; color: #6b7280; padding: 20px;'>No hay habilidades registradas en el sistema.</p>";
        }
        var cont = document.getElementById('contenedor-habilidades');
        if (cont) cont.innerHTML = html;
    }

    function sumarHora(fila) {
        google.script.run
            .withSuccessHandler(function() {
                cargarHabilidades(true);
            })
            .withFailureHandler(function(err) {
                alert("Error al registrar hora: " + err.message);
            })
            .sumarHoraHabilidad(fila);
    }

    // --------------------------------------------------------------------------
    // ESTADO PERSONAL Y FATIGA
    // --------------------------------------------------------------------------
    function cargarEstadoPersonal(fatigaData) {
        if (fatigaData) {
            APP_STATE.fatiga = fatigaData;
            renderizarBarrasFatiga(fatigaData);
            return;
        }
        if (APP_STATE.fatiga) {
            renderizarBarrasFatiga(APP_STATE.fatiga);
            return;
        }
        google.script.run
            .withSuccessHandler(function(dataServidor) {
                var f = dataServidor || { brazos: 0, pecho: 0, espalda: 0, abdominales: 0, piernas: 0, mente: 0 };
                APP_STATE.fatiga = f;
                renderizarBarrasFatiga(f);
            })
            .obtenerUltimaFatiga();
    }

    function renderizarBarrasFatiga(f) {
        var fatiga = f || {};

        // 19 Canales anatómicos organizados de la cabeza a los pies con Mente en la cima
        var zonasAnatomicas = [
            {
                id: "zona-mente",
                titulo: "🧠 SISTEMA NEURAL & MENTE",
                esMente: true,
                musculos: [
                    { key: "mente", nombre: "Mente & Concentración (Enfoque)", icono: "🧠" }
                ]
            },
            {
                id: "zona-hombros",
                titulo: "🛡️ HOMBROS (DELTOIDES)",
                musculos: [
                    { key: "delt_ant", nombre: "Deltoides Anterior (Frontal)", icono: "🛡️" },
                    { key: "delt_lat", nombre: "Deltoides Lateral (Anchura)", icono: "🛡️" },
                    { key: "delt_post", nombre: "Deltoides Posterior (Trasero)", icono: "🛡️" },
                    { key: "manguito", nombre: "Manguito Rotador (Estabilizadores)", icono: "🔄" }
                ]
            },
            {
                id: "zona-pecho",
                titulo: "⚔️ PECHO (PECTORALES)",
                musculos: [
                    { key: "pect_mayor", nombre: "Pectoral Mayor (Superior / Medio)", icono: "⚔️" },
                    { key: "pect_menor", nombre: "Pectoral Menor (Inferior)", icono: "⚔️" }
                ]
            },
            {
                id: "zona-brazos",
                titulo: "💪 BRAZOS & ANTEBRAZOS",
                musculos: [
                    { key: "biceps", nombre: "Bíceps Braquial & Anterior", icono: "💪" },
                    { key: "triceps", nombre: "Tríceps Braquial (3 Cabezas)", icono: "💪" },
                    { key: "antebrazos", nombre: "Antebrazos (Flexores / Agarre)", icono: "✊" }
                ]
            },
            {
                id: "zona-espalda",
                titulo: "🦅 ESPALDA & POSTURA",
                musculos: [
                    { key: "trapecios", nombre: "Trapecios y Romboides", icono: "🦅" },
                    { key: "dorsales", nombre: "Dorsales y Redondos (Anchura 'V')", icono: "🦅" },
                    { key: "lumbares", nombre: "Erectores Espinales (Zona Lumbar)", icono: "🏛️" }
                ]
            },
            {
                id: "zona-core",
                titulo: "⚡ CORE & ABDOMEN",
                musculos: [
                    { key: "core", nombre: "Recto Abdominal, Oblicuos & Transverso", icono: "⚡" }
                ]
            },
            {
                id: "zona-cadera-gluteos",
                titulo: "🥋 CADERA & GLÚTEOS",
                musculos: [
                    { key: "gluteos", nombre: "Glúteos (Mayor, Medio y Menor)", icono: "🍑" },
                    { key: "cadera", nombre: "Cadera / Aductores e Iliopsoas", icono: "🥋" }
                ]
            },
            {
                id: "zona-piernas",
                titulo: "🦵 MUSLOS (PIERNAS)",
                musculos: [
                    { key: "cuadriceps", nombre: "Cuádriceps (Recto & Vastos)", icono: "🦵" },
                    { key: "isquios", nombre: "Isquiotibiales (Cadena Posterior)", icono: "🦵" }
                ]
            },
            {
                id: "zona-pantorrillas",
                titulo: "🦶 PANTORRILLAS & TOBILLOS",
                musculos: [
                    { key: "pantorrillas", nombre: "Pantorrillas (Gemelos & Sóleo)", icono: "🦶" }
                ]
            }
        ];

        var html = '<div class="anatomical-container">';

        zonasAnatomicas.forEach(function(zona) {
            var claseCard = zona.esMente ? 'anatomical-zone-card mental-zone-card' : 'anatomical-zone-card';
            
            var sumaZona = 0;
            zona.musculos.forEach(function(m) {
                sumaZona += (Number(fatiga[m.key]) || 0);
            });
            var promZona = Math.round(sumaZona / zona.musculos.length);

            html += `<div class="${claseCard}">
                <div class="zone-header">
                    <span class="zone-title">${zona.titulo}</span>
                    <span class="zone-badge-avg">${promZona}% Carga</span>
                </div>
                <div>`;

            zona.musculos.forEach(function(m) {
                var val = Math.min(100, Math.max(0, Number(fatiga[m.key]) || 0));
                
                var colorClase = 'val-low';
                var barClase = 'bar-dyn-low';
                if (val >= 70) {
                    colorClase = 'val-high';
                    barClase = 'bar-dyn-high';
                } else if (val >= 40) {
                    colorClase = 'val-mid';
                    barClase = 'bar-dyn-mid';
                }

                html += `
                <div class="muscle-bar-item">
                    <div class="muscle-bar-info">
                        <span>${m.icono} ${m.nombre}</span>
                        <span class="fatigue-val-badge ${colorClase}">${val}% Fatiga</span>
                    </div>
                    <div class="muscle-bar-track">
                        <div class="muscle-bar-fill-dyn ${barClase}" style="width: ${val}%;"></div>
                    </div>
                </div>`;
            });

            html += `</div></div>`;
        });

        html += '</div>';

        var contenedor = document.getElementById('contenedor-grafica-fatiga');
        if (contenedor) contenedor.innerHTML = html;

        // Actualizar promedio diario y último cierre en el widget superior
        var promedioElem = document.getElementById('promedio-hoy-display');
        var cierreElem = document.getElementById('ultimo-cierre-display');
        if (promedioElem) {
            promedioElem.innerText = (fatiga.promedioHoy !== undefined ? fatiga.promedioHoy : 0) + "%";
        }
        if (cierreElem) {
            cierreElem.innerText = fatiga.ultimoCierre || "Sin registros previos";
        }
    }

    // --------------------------------------------------------------------------
    // CONDICIÓN FÍSICA (GYM Y RUTINAS DINÁMICAS DESDE SHEETS)
    // --------------------------------------------------------------------------

    // Paleta de íconos para las rutinas (asignación cíclica)
    var RUTINA_PALETA = [
        { icono: '🌅', rankLabel: 'DIARIA · ACTIVACIÓN' },
        { icono: '🔥', rankLabel: 'FUERZA · INTENSIDAD' },
        { icono: '🦵', rankLabel: 'POTENCIA · RESISTENCIA' },
        { icono: '🛡️', rankLabel: 'TRACCIÓN · TÉCNICA' },
        { icono: '⚡', rankLabel: 'EXPLOSIVA · CORE' },
        { icono: '🏋️', rankLabel: 'FUNCIONAL · MIXTA' },
    ];

    // Rutina actualmente seleccionada para ver detalle
    var RUTINA_ACTIVA = null;

    function cargarGym(forzarRefresco) {
        if (APP_STATE.rutinas && APP_STATE.rutinas.length > 0 && !forzarRefresco) {
            renderizarPortalesRutinas(APP_STATE.rutinas);
            renderizarGym(APP_STATE.gym);
            return;
        }
        // Cargar rutinas y ejercicios del servidor
        google.script.run
            .withSuccessHandler(function(res) {
                APP_STATE.rutinas = res.rutinas || [];
                APP_STATE.ejercicios = res.ejercicios || [];
                APP_STATE.gym = res.gym || [];
                renderizarPortalesRutinas(APP_STATE.rutinas);
                renderizarGym(APP_STATE.gym);
            })
            .withFailureHandler(function(err) {
                document.getElementById('contenedor-portales-rutinas').innerHTML =
                    "<p style='color:#ef4444;'>Error al cargar rutinas: " + err.message + "</p>";
            })
            .obtenerDatosGym();
    }

    function renderizarPortalesRutinas(rutinas) {
        var cont = document.getElementById('contenedor-portales-rutinas');
        if (!cont) return;

        if (!rutinas || rutinas.length === 0) {
            cont.innerHTML = "<p style='color:#6b7280;text-align:center;padding:20px;'>No hay rutinas programadas en la hoja Rutinas.</p>";
            return;
        }

        var html = '';
        rutinas.forEach(function(rut, idx) {
            var paleta = RUTINA_PALETA[idx % RUTINA_PALETA.length];
            var numEj = rut.ejercicios ? rut.ejercicios.length : 0;
            var badgeEj = numEj > 0
                ? numEj + ' Ejercicio' + (numEj !== 1 ? 's' : '')
                : 'Rutina Vacía';

            html += '<div class="quest-card" onclick="abrirDetalleRutina(' + idx + ')">' +
                '<div class="quest-icon-box">' + paleta.icono + '</div>' +
                '<div style="flex:1;">' +
                  '<span class="quest-badge-rank">' + paleta.rankLabel + '</span>' +
                  '<p class="quest-card-name" style="margin:4px 0 6px 0;color:#111827;font-size:15px;font-weight:700;">' + rut.nombre + '</p>' +
                  '<div class="muscle-tags-row">' +
                    '<span class="muscle-tag">' + rut.codigo + '</span>' +
                    '<span class="muscle-tag">' + badgeEj + '</span>' +
                  '</div>' +
                '</div>' +
                '<span class="quest-arrow">›</span>' +
              '</div>';
        });
        cont.innerHTML = html;
    }

    /**
     * Abre la vista de detalle dinámica de una rutina por su índice en APP_STATE.rutinas.
     */
    function abrirDetalleRutina(idx) {
        var rutina = APP_STATE.rutinas[idx];
        if (!rutina) return;
        RUTINA_ACTIVA = { rutina: rutina, idx: idx };

        var paleta = RUTINA_PALETA[idx % RUTINA_PALETA.length];
        var cont = document.getElementById('contenedor-detalle-rutina-dinamica');
        var tituloEl = document.getElementById('detalle-rutina-titulo');
        var badgeEl = document.getElementById('detalle-rutina-badge');

        if (tituloEl) { tituloEl.innerText = rutina.nombre; tituloEl.style.color = ''; }
        if (badgeEl)  { badgeEl.innerText = paleta.rankLabel; badgeEl.style.borderColor = ''; badgeEl.style.color = ''; }

        // Renderizar ejercicios o mensaje de vacío
        if (!cont) return;

        if (rutina.vacia || !rutina.ejercicios || rutina.ejercicios.length === 0) {
            cont.innerHTML =
                '<div style="text-align:center;padding:40px 20px;">' +
                  '<div style="font-size:48px;margin-bottom:12px;">📭</div>' +
                  '<h3 style="color:#374151;margin:0 0 8px 0;">Rutina Vacía</h3>' +
                  '<p style="color:#6b7280;font-size:14px;line-height:1.5;">' +
                    'Esta rutina aún no tiene ejercicios asignados.<br>' +
                    'Agrega ejercicios en la hoja <strong style="color:#111827;">Rutinas</strong> usando los códigos de la hoja <strong style="color:#111827;">Ejercicios</strong>.' +
                  '</p>' +
                '</div>';
            // Ocultar botón de registrar
            var btnReg = document.getElementById('btn-registrar-rutina-dinamica');
            var progrCont = document.getElementById('progreso-rutina-dinamica-cont');
            if (btnReg) btnReg.style.display = 'none';
            if (progrCont) progrCont.style.display = 'none';
        } else {
            var numEj = rutina.ejercicios.length;

    /**
     * Actualiza la barra de progreso de la rutina dinámica activa.
     */
    function actualizarProgresoRutinaDinamica(claseCheck, total, rutinaIdx) {
        var paleta = RUTINA_PALETA[rutinaIdx % RUTINA_PALETA.length];
        var checkboxes = document.querySelectorAll('.' + claseCheck);
        var marcados = 0;

        checkboxes.forEach(function(chk) {
            var label = chk.closest('label');
            var badgeStatus = label ? label.querySelector('.badge-status-item') : null;
            if (chk.checked) {
                marcados++;
                if (label) label.classList.add('checked-active');
                if (badgeStatus) badgeStatus.innerText = '✓ LISTO';
            } else {
                if (label) label.classList.remove('checked-active');
                if (badgeStatus) badgeStatus.innerText = 'PENDIENTE';
            }
        });

        var porcentaje = total > 0 ? Math.round((marcados / total) * 100) : 0;
        var barra = document.getElementById('progreso-barra-rutina-dinamica');
        var texto = document.getElementById('progreso-texto-rutina-dinamica');
        var boton = document.getElementById('btn-registrar-rutina-dinamica');

        if (barra) barra.style.width = porcentaje + '%';
        if (texto) texto.innerText = marcados + ' / ' + total + ' (' + porcentaje + '%)';

        if (boton) {
            if (marcados === total && total > 0) {
                boton.disabled = false;
                boton.classList.add('btn-ready-pulse');
            } else {
                boton.disabled = true;
                boton.classList.remove('btn-ready-pulse');
            }
        }
    }

    /**
     * Registra la rutina dinámica activa (llama a la función de rutina genérica del servidor).
     */
    function ejecutarRutinaDinamica() {
        if (!RUTINA_ACTIVA) return;
        var rutina = RUTINA_ACTIVA.rutina;
        var boton = document.getElementById('btn-registrar-rutina-dinamica');
        if (boton) { boton.innerText = 'Registrando...'; boton.disabled = true; boton.classList.remove('btn-ready-pulse'); }

        // Construir mapa de incrementos de fatiga sumando todos los ejercicios
        var incrementos = {};
        rutina.ejercicios.forEach(function(ej) {
            if (ej.fatiga) {
                Object.keys(ej.fatiga).forEach(function(letra) {
                    incrementos[letra] = (incrementos[letra] || 0) + (ej.fatiga[letra] || 0);
                });
            }
        });

        google.script.run
            .withSuccessHandler(function(response) {
                if (boton) { boton.innerText = 'Completar y Registrar Rutina'; boton.disabled = true; boton.classList.remove('btn-ready-pulse'); }

                // Resetear checkboxes
                if (RUTINA_ACTIVA) {
                    var claseCheck = 'check-rutina-din-' + RUTINA_ACTIVA.idx;
                    document.querySelectorAll('.' + claseCheck).forEach(function(chk) {
                        chk.checked = false;
                        var label = chk.closest('label');
                        if (label) { label.classList.remove('checked-active'); }
                        var bs = label ? label.querySelector('.badge-status-item') : null;
                        if (bs) bs.innerText = 'PENDIENTE';
                    });
                }

                var progrBarra = document.getElementById('progreso-barra-rutina-dinamica');
                var progrTexto = document.getElementById('progreso-texto-rutina-dinamica');
                if (progrBarra) progrBarra.style.width = '0%';
                if (progrTexto && RUTINA_ACTIVA) progrTexto.innerText = '0 / ' + RUTINA_ACTIVA.rutina.ejercicios.length + ' (0%)';

                if (response && response.success) {
                    alert('¡' + rutina.nombre + ' completada con éxito! Estado del avatar actualizado.');
                    if (response.fatiga) {
                        APP_STATE.fatiga = response.fatiga;
                        renderizarBarrasFatiga(response.fatiga);
                    }
                    cambiarVista('vista-estado-personal');
                    cargarGym(true);
                } else {
                    alert('Error: ' + (response ? response.error : 'No se pudo registrar la rutina'));
                }
            })
            .withFailureHandler(function(error) {
                if (boton) { boton.innerText = 'Completar y Registrar Rutina'; boton.disabled = false; }
                alert('Error de conexión: ' + error.message);
            })
            .registrarRutinaGenerica(rutina.nombre, incrementos);
    }

    var STRETCH_SESSION = {

    };

    /**
     * Abre el modal del sistema e inicia la fase de estiramientos previos.
     */
    function iniciarRutinaConEstiramiento(vistaDestino, nombreRutina) {
        STRETCH_SESSION.vistaDestino = vistaDestino;
        STRETCH_SESSION.nombreRutina = nombreRutina;
        STRETCH_SESSION.indiceActual = 0;
        STRETCH_SESSION.segundosRestantes = 30;
        STRETCH_SESSION.pausado = false;

        if (STRETCH_SESSION.intervalId) {
            clearInterval(STRETCH_SESSION.intervalId);
            STRETCH_SESSION.intervalId = null;
        }

        var modal = document.getElementById('modal-estiramientos');
        var body = document.getElementById('modal-stretching-body');
        var complete = document.getElementById('modal-stretching-complete');
        var routineTitle = document.getElementById('stretch-routine-target');

        if (routineTitle) routineTitle.innerText = "PREPARACIÓN: " + nombreRutina;
        if (body) body.style.display = 'block';
        if (complete) complete.style.display = 'none';
        if (modal) modal.style.display = 'flex';

        actualizarCardEstiramiento();
        iniciarIntervaloEstiramiento();
    }

    function actualizarCardEstiramiento() {
        var ex = STRETCHING_EXERCISES[STRETCH_SESSION.indiceActual];
        if (!ex) return;

        var iconElem = document.getElementById('stretch-icon');
        var titleElem = document.getElementById('stretch-title');
        var descElem = document.getElementById('stretch-desc');
        var timerElem = document.getElementById('timer-countdown');
        var barFill = document.getElementById('timer-bar-fill');
        var btnToggle = document.getElementById('btn-timer-toggle');

        if (iconElem) iconElem.innerText = ex.icono;
        if (titleElem) titleElem.innerText = ex.nombre;
        if (descElem) descElem.innerText = ex.descripcion;
        if (timerElem) {
            timerElem.innerText = STRETCH_SESSION.segundosRestantes;
            timerElem.classList.remove('warning');
        }
        if (barFill) barFill.style.width = '100%';
        if (btnToggle) btnToggle.innerText = "⏸ Pausar";

        // Actualizar barra de pasos [1] [2] [3] [4]
        var stepsIndicator = document.getElementById('stretch-steps-indicator');
        if (stepsIndicator) {
            var htmlSteps = '';
            for (var i = 0; i < STRETCHING_EXERCISES.length; i++) {
                var clase = 'stretch-step-pill';
                if (i < STRETCH_SESSION.indiceActual) clase += ' completed';
                else if (i === STRETCH_SESSION.indiceActual) clase += ' active';
                htmlSteps += `<div class="${clase}"></div>`;
            }
            stepsIndicator.innerHTML = htmlSteps;
        }
    }

    function iniciarIntervaloEstiramiento() {
        if (STRETCH_SESSION.intervalId) {
            clearInterval(STRETCH_SESSION.intervalId);
        }

        STRETCH_SESSION.intervalId = setInterval(function() {
            if (STRETCH_SESSION.pausado) return;

            STRETCH_SESSION.segundosRestantes--;

            var timerElem = document.getElementById('timer-countdown');
            var barFill = document.getElementById('timer-bar-fill');

            if (timerElem) {
                timerElem.innerText = STRETCH_SESSION.segundosRestantes;
                if (STRETCH_SESSION.segundosRestantes <= 5) {
                    timerElem.classList.add('warning');
                } else {
                    timerElem.classList.remove('warning');
                }
            }

            if (barFill) {
                var porcentaje = (STRETCH_SESSION.segundosRestantes / 30) * 100;
                barFill.style.width = Math.max(0, porcentaje) + '%';
            }

            if (STRETCH_SESSION.segundosRestantes <= 0) {
                clearInterval(STRETCH_SESSION.intervalId);
                STRETCH_SESSION.intervalId = null;
                // Siguiente ejercicio o finalizar con éxito
                if (STRETCH_SESSION.indiceActual < STRETCHING_EXERCISES.length - 1) {
                    siguienteEstiramiento();
                } else {
                    finalizarEstiramientosExito();
                }
            }
        }, 1000);
    }

    function toggleTemporizadorEstiramiento() {
        STRETCH_SESSION.pausado = !STRETCH_SESSION.pausado;
        var btnToggle = document.getElementById('btn-timer-toggle');
        if (btnToggle) {
            btnToggle.innerText = STRETCH_SESSION.pausado ? "▶ Reanudar" : "⏸ Pausar";
        }
    }

    function siguienteEstiramiento() {
        if (STRETCH_SESSION.intervalId) {
            clearInterval(STRETCH_SESSION.intervalId);
            STRETCH_SESSION.intervalId = null;
        }

        STRETCH_SESSION.indiceActual++;
        if (STRETCH_SESSION.indiceActual < STRETCHING_EXERCISES.length) {
            STRETCH_SESSION.segundosRestantes = 30;
            STRETCH_SESSION.pausado = false;
            actualizarCardEstiramiento();
            iniciarIntervaloEstiramiento();
        } else {
            finalizarEstiramientosExito();
        }
    }

    function finalizarEstiramientosExito() {
        if (STRETCH_SESSION.intervalId) {
            clearInterval(STRETCH_SESSION.intervalId);
            STRETCH_SESSION.intervalId = null;
        }

        var body = document.getElementById('modal-stretching-body');
        var complete = document.getElementById('modal-stretching-complete');

        if (body) body.style.display = 'none';
        if (complete) complete.style.display = 'block';
    }

    function irARutinaDesbloqueada() {
        cerrarModalEstiramientos();
        if (STRETCH_SESSION.vistaDestino) {
            cambiarVista(STRETCH_SESSION.vistaDestino);

    }

    function omitirEstiramientos() {
        cerrarModalEstiramientos();
        if (STRETCH_SESSION.vistaDestino) {
            cambiarVista(STRETCH_SESSION.vistaDestino);
        }
    }

    function cerrarModalEstiramientos() {
        if (STRETCH_SESSION.intervalId) {

            STRETCH_SESSION.intervalId = null;
        }
        var modal = document.getElementById('modal-estiramientos');
        if (modal) modal.style.display = 'none';
    }

    function cargarMente(forzarRefresco) {
        if (APP_STATE.salud && !forzarRefresco) {
            renderizarMente(APP_STATE.salud);
            return;
        }
        google.script.run
            .withSuccessHandler(function(salud) {
                APP_STATE.salud = salud;
                renderizarMente(salud);
            })
            .withFailureHandler(function(err) {
                document.getElementById('contenedor-mente').innerHTML = "<p style='color:#ef4444;'>Error: " + err.message + "</p>";
            })
            .getSalud();
    }

    function renderizarMente(salud) {
        var html = "<table><tr><th>Fecha</th><th>Registro / Sueño</th></tr>";
        if (salud && salud.length > 0) {
            salud.forEach(function(s) {
                html += `<tr><td>${s.fecha}</td><td>${s.valor}</td></tr>`;
            });
        } else {
            html += "<tr><td colspan='2'>Sin registros de descanso o mente.</td></tr>";
        }
        html += "</table>";
        var cont = document.getElementById('contenedor-mente');
        if (cont) cont.innerHTML = html;
    }

    function guardarMente() {
        var input = document.getElementById('input-nueva-mente');
        var texto = input ? input.value.trim() : "";
        if (!texto) return;
        
        google.script.run
            .withSuccessHandler(function() {
                if (input) input.value = '';
                cargarMente(true);
            })
            .withFailureHandler(function(err) {
                alert("Error al guardar: " + err.message);
            })
            .registrarSalud('Mente', texto);
    }

    /**
     * Renderiza todo el panel financiero: Datos generales, Ingresos, Gastos,
     * Regla 50/40/10, Deudas, Metas con cuotas de quince y último, y Gráfica.
     */
    function renderizarFinanzas(datos) {
        if (!datos) return;

        // 1. Datos Generales
        if (datos.generales) {
            var inputNombre = document.getElementById('finanzas-input-nombre');
            var inputMes = document.getElementById('finanzas-input-mes');
            var inputObj = document.getElementById('finanzas-input-objetivo');

            if (inputNombre && datos.generales.nombre) inputNombre.value = datos.generales.nombre;
            if (inputMes && datos.generales.mes) inputMes.value = datos.generales.mes;
            if (inputObj && datos.generales.objetivo) inputObj.value = datos.generales.objetivo;
        }

        var ingresos = datos.ingresos || [];
        var gastos = datos.gastos || [];
        var deudas = datos.deudas || [];
        var metas = datos.metas || [];

        // 2. Renderizar Ingresos y calcular Total
        var tbodyIng = document.getElementById('tbody-ingresos');
        var totalIngresos = 0;
        if (tbodyIng) {
            var htmlIng = "";
            if (ingresos.length === 0) {
                htmlIng = `<tr><td colspan="4" style="text-align: center; color: #64748b; font-style: italic;">Sin entradas de ingresos registradas aún.</td></tr>`;
            } else {
                ingresos.forEach(function(ing) {
                    var m = Number(ing.monto) || 0;
                    totalIngresos += m;
                    htmlIng += `
                        <tr>
                            <td style="font-weight: 600; color: #f8fafc;">${ing.fuente}</td>
                            <td style="text-align: center; color: #94a3b8;">Día ${ing.dia || 15}</td>
                            <td style="text-align: right;" class="monto-positivo">$${m.toFixed(2)}</td>
                            <td style="text-align: center;">
                                <button class="btn-delete-row" onclick="eliminarRegistroFinanzasUI('${ing.id}', 'ingreso')" title="Eliminar entrada">✕</button>
                            </td>
                        </tr>
                    `;
                });
            }
            tbodyIng.innerHTML = htmlIng;
        }
        var lblTotIng = document.getElementById('label-total-ingresos');
        if (lblTotIng) lblTotIng.textContent = "$" + totalIngresos.toFixed(2);

        // 3. Renderizar Gastos y calcular Total
        var tbodyGas = document.getElementById('tbody-gastos');
        var totalGastos = 0;
        var gastosPorCat = {
            "Vivienda": 0, "Alimentación": 0, "Moto": 0, 
            "Servicios": 0, "Salud": 0, "Entretenimiento": 0, "Otros": 0
        };

        if (tbodyGas) {
            var htmlGas = "";
            if (gastos.length === 0) {
                htmlGas = `<tr><td colspan="5" style="text-align: center; color: #64748b; font-style: italic;">Sin salidas de gastos registradas aún.</td></tr>`;
            } else {
                gastos.forEach(function(gas) {
                    var m = Number(gas.monto) || 0;
                    totalGastos += m;
                    var cat = gas.categoria || "Otros";
                    if (gastosPorCat.hasOwnProperty(cat)) {
                        gastosPorCat[cat] += m;
                    } else {
                        gastosPorCat["Otros"] += m;
                    }

                    var catClass = "cat-" + cat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    htmlGas += `
                        <tr>
                            <td style="font-weight: 600; color: #f8fafc;">${gas.fuente}</td>
                            <td><span class="badge-cat ${catClass}">${cat}</span></td>
                            <td style="text-align: center; color: #94a3b8;">Día ${gas.dia || 5}</td>
                            <td style="text-align: right;" class="monto-negativo">$${m.toFixed(2)}</td>
                            <td style="text-align: center;">
                                <button class="btn-delete-row" onclick="eliminarRegistroFinanzasUI('${gas.id}', 'gasto')" title="Eliminar gasto">✕</button>
                            </td>
                        </tr>
                    `;
                });
            }
            tbodyGas.innerHTML = htmlGas;
        }
        var lblTotGas = document.getElementById('label-total-gastos');
        if (lblTotGas) lblTotGas.textContent = "$" + totalGastos.toFixed(2);

        // 4. Regla 50/40/10 (Basada en Total Ingresos)
        var regla50 = totalIngresos * 0.50;
        var regla40 = totalIngresos * 0.40;
        var regla10 = totalIngresos * 0.10;

        var elRegla50 = document.getElementById('regla-monto-50');
        var elRegla40 = document.getElementById('regla-monto-40');
        var elRegla10 = document.getElementById('regla-monto-10');
        if (elRegla50) elRegla50.textContent = "$" + regla50.toFixed(2);
        if (elRegla40) elRegla40.textContent = "$" + regla40.toFixed(2);
        if (elRegla10) elRegla10.textContent = "$" + regla10.toFixed(2);

        // 5. Renderizar Deudas y calcular Total
        var tbodyDeu = document.getElementById('tbody-deudas');
        var totalDeudas = 0;
        if (tbodyDeu) {
            var htmlDeu = "";
            if (deudas.length === 0) {
                htmlDeu = `<tr><td colspan="4" style="text-align: center; color: #64748b; font-style: italic;">No tienes deudas activas registradas. ¡Excelente!</td></tr>`;
            } else {
                deudas.forEach(function(deu) {
                    var m = Number(deu.monto) || 0;
                    totalDeudas += m;
                    htmlDeu += `
                        <tr>
                            <td style="font-weight: 600; color: #f8fafc;">${deu.deuda}</td>
                            <td style="text-align: center; color: #94a3b8;">Día ${deu.dia || 20}</td>
                            <td style="text-align: right;" class="monto-deuda">$${m.toFixed(2)}</td>
                            <td style="text-align: center;">
                                <button class="btn-delete-row" onclick="eliminarRegistroFinanzasUI('${deu.id}', 'deuda')" title="Eliminar deuda">✕</button>
                            </td>
                        </tr>
                    `;
                });
            }
            tbodyDeu.innerHTML = htmlDeu;
        }
        var lblTotDeu = document.getElementById('label-total-deudas');
        if (lblTotDeu) lblTotDeu.textContent = "$" + totalDeudas.toFixed(2);

        // 6. Renderizar Metas Financieras (Cuotas de quince y último)
        var contMetas = document.getElementById('contenedor-metas-cards');
        if (contMetas) {
            var htmlMetas = "";
            if (metas.length === 0) {
                htmlMetas = `<div style="grid-column: 1 / -1; text-align: center; color: #64748b; padding: 20px; font-style: italic;">No tienes metas financieras activas. ¡Crea una nueva meta con cuotas de quince y último!</div>`;
            } else {
                metas.forEach(function(meta) {
                    var metaTot = Number(meta.metaTotal) || 0;
                    var ahorrado = Number(meta.ahorrado) || 0;
                    var faltante = Math.max(0, metaTot - ahorrado);
                    var pct = metaTot > 0 ? Math.min(100, Math.round((ahorrado / metaTot) * 100)) : 0;
                    var meses = Number(meta.meses) || 1;
                    var cuotas = Number(meta.cuotas) || (meses * 2);
                    var cuotaVal = Number(meta.cuotaQuincenal) || (cuotas > 0 ? (faltante / cuotas) : 0);
                    var completada = pct >= 100;

                    htmlMetas += `
                        <div class="meta-card">
                            <div>
                                <div class="meta-card-header">
                                    <h4 class="meta-card-title">${meta.nombre}</h4>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <span style="font-size: 13px; font-weight: 800; color: ${completada ? '#34d399' : '#60a5fa'};">${pct}%</span>
                                        <button class="btn-delete-row" onclick="eliminarRegistroFinanzasUI('${meta.id}', 'meta')" title="Eliminar meta">✕</button>
                                    </div>
                                </div>

                                <div class="meta-numbers-row">
                                    <span>Ahorrado: <strong style="color: #34d399;">$${ahorrado.toFixed(2)}</strong></span>
                                    <span>Faltante: <strong style="color: #f87171;">$${faltante.toFixed(2)}</strong></span>
                                    <span>Meta: <strong>$${metaTot.toFixed(2)}</strong></span>
                                </div>

                                <div class="meta-progress-track">
                                    <div class="meta-progress-fill" style="width: ${pct}%;"></div>
                                </div>

                                <div class="meta-cuotas-info">
                                    📅 <strong>${meses} ${meses === 1 ? 'mes' : 'meses'} estimados</strong> · ${cuotas} cuotas quincenales de <strong style="color: #fbbf24;">$${cuotaVal.toFixed(2)}</strong> (quince y último)
                                </div>
                            </div>

                            <div>
                                ${!completada ? `
                                    <button class="btn-sumar-cuota" onclick="abonarCuotaMetaUI('${meta.id}')">
                                        ⚡ + Sumar Cuota de $${cuotaVal.toFixed(2)} a Ahorros
                                    </button>
                                ` : `
                                    <div style="text-align: center; padding: 8px; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; border-radius: 8px; color: #34d399; font-weight: 800; font-size: 13px;">
                                        🏆 ¡OBJETIVO Y META LOGRADA!
                                    </div>
                                `}
                            </div>
                        </div>
                    `;
                });
            }
            contMetas.innerHTML = htmlMetas;
        }

        // 7. Resumen Financiero General y Métricas
        var ahorroInversion50 = regla40 + regla10;
        var balanceNeto = totalIngresos - totalGastos - totalDeudas;

        var elResIng = document.getElementById('resumen-total-ingresos');
        var elResGas = document.getElementById('resumen-total-gastos');
        var elResDeu = document.getElementById('resumen-total-deudas');
        var elResAho = document.getElementById('resumen-total-ahorro-inversion');
        var elResNet = document.getElementById('resumen-flujo-neto');

        if (elResIng) elResIng.textContent = "$" + totalIngresos.toFixed(2);
        if (elResGas) elResGas.textContent = "$" + totalGastos.toFixed(2);
        if (elResDeu) elResDeu.textContent = "$" + totalDeudas.toFixed(2);
        if (elResAho) elResAho.textContent = "$" + ahorroInversion50.toFixed(2);
        if (elResNet) {
            elResNet.textContent = "$" + balanceNeto.toFixed(2);
            elResNet.style.color = balanceNeto >= 0 ? "#60a5fa" : "#ef4444";
        }

        var badgeEstado = document.getElementById('badge-balance-estado');
        if (badgeEstado) {
            if (balanceNeto >= 0) {
                badgeEstado.textContent = "FLUJO SALUDABLE (SUPERÁVIT)";
                badgeEstado.style.background = "rgba(16, 185, 129, 0.2)";
                badgeEstado.style.color = "#34d399";
                badgeEstado.style.borderColor = "#10b981";
            } else {
                badgeEstado.textContent = "ALERTA DE DÉFICIT";
                badgeEstado.style.background = "rgba(239, 68, 68, 0.2)";
                badgeEstado.style.color = "#f87171";
                badgeEstado.style.borderColor = "#ef4444";
            }
        }

        // 8. Renderizar Gráfica Financiera Interactiva (Chart.js)
        renderizarGraficoFinanzas(totalIngresos, totalGastos, totalDeudas, gastosPorCat);
    }

    /**
     * Dibuja la gráfica financiera comparativa y de distribución de gastos con Chart.js.
     */
    function renderizarGraficoFinanzas(ingresos, gastos, deudas, gastosPorCat) {
        var canvas = document.getElementById('graficoFinanzas');
        if (!canvas) return;

        if (typeof Chart === 'undefined') {
            return;
        }

        if (ESTADO_FINANZAS.chartInstance) {
            ESTADO_FINANZAS.chartInstance.destroy();
        }

        var ctx = canvas.getContext('2d');
        var catLabels = Object.keys(gastosPorCat);
        var catValores = catLabels.map(function(k) { return gastosPorCat[k]; });

        ESTADO_FINANZAS.chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Ingresos', 'Gastos Tot.', 'Deudas', 'Vivienda', 'Alimentación', 'Moto', 'Servicios', 'Otros'],
                datasets: [{
                    label: 'Monto ($)',
                    data: [
                        ingresos, 
                        gastos, 
                        deudas, 
                        gastosPorCat['Vivienda'] || 0,
                        gastosPorCat['Alimentación'] || 0,
                        gastosPorCat['Moto'] || 0,
                        gastosPorCat['Servicios'] || 0,
                        (gastosPorCat['Salud'] || 0) + (gastosPorCat['Entretenimiento'] || 0) + (gastosPorCat['Otros'] || 0)
                    ],
                    backgroundColor: [
                        '#111827', // Negro Carbón (Ingresos)
                        '#4b5563', // Gris Oscuro (Gastos)
                        '#6b7280', // Gris Medio (Deudas)
                        '#9ca3af', // Gris Suave (Vivienda)
                        '#1f2937', // Carbón (Alimentación)
                        '#374151', // Grafito (Moto)
                        '#6b7280', // Pizarra (Servicios)
                        '#d1d5db'  // Gris Claro (Otros)
                    ],
                    borderColor: [
                        '#111827', '#4b5563', '#6b7280',
                        '#9ca3af', '#1f2937', '#374151', '#6b7280', '#d1d5db'
                    ],
                    borderWidth: 1,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#111827',
                        titleColor: '#ffffff',
                        bodyColor: '#e5e7eb',
                        borderColor: '#27272a',
                        borderWidth: 1,
                        padding: 10,
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                return " $" + Number(context.raw).toFixed(2);
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: '#6b7280',
                            font: { family: "'Plus Jakarta Sans', sans-serif", size: 11 },
                            callback: function(value) { return '$' + value; }
                        },
                        grid: { color: 'rgba(0, 0, 0, 0.05)' }
                    },
                    x: {
                        ticks: {
                            color: '#374151',
                            font: { family: "'Plus Jakarta Sans', sans-serif", size: 11, weight: '600' }
                        },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function actualizarCalculoCuotaMeta() {

        var ahorrado = Number(document.getElementById('modal-meta-ahorrado').value) || 0;
        var meses = Number(document.getElementById('modal-meta-meses').value) || 1;

        var faltante = Math.max(0, total - ahorrado);
        var cuotas = Math.max(1, meses * 2);
        var cuotaVal = cuotas > 0 ? (faltante / cuotas) : 0;

        var elFalt = document.getElementById('preview-meta-faltante');
        var elCuot = document.getElementById('preview-meta-cuotas');
        var elVal = document.getElementById('preview-meta-cuotavalor');

        if (elFalt) elFalt.textContent = "$" + faltante.toFixed(2);
        if (elCuot) elCuot.textContent = cuotas + " cuotas";
        if (elVal) elVal.textContent = "$" + cuotaVal.toFixed(2);
    }

    function confirmarAgregarMeta() {
        var nombre = document.getElementById('modal-meta-nombre').value.trim();
        var total = Number(document.getElementById('modal-meta-total').value) || 0;
        var ahorrado = Number(document.getElementById('modal-meta-ahorrado').value) || 0;
        var meses = Number(document.getElementById('modal-meta-meses').value) || 1;
        var mesPeriodo = document.getElementById('finanzas-input-mes').value;

        if (!nombre) return alert("Por favor escribe el nombre de la meta.");
        if (total <= 0) return alert("Por favor escribe un monto total objetivo mayor a 0.");

        cerrarModalMeta();

        var faltante = Math.max(0, total - ahorrado);
        var cuotas = meses * 2;
        var cuotaVal = Math.round((faltante / cuotas) * 100) / 100;

        // Actualización optimista
        var nuevo = {
            id: "MET-" + Date.now(),
            nombre: nombre,
            metaTotal: total,
            ahorrado: ahorrado,
            faltante: faltante,
            meses: meses,
            cuotas: cuotas,
            cuotaQuincenal: cuotaVal
        };

        if (!APP_STATE.finanzas) APP_STATE.finanzas = { ingresos: [], gastos: [], deudas: [], metas: [] };
        if (!APP_STATE.finanzas.metas) APP_STATE.finanzas.metas = [];
        APP_STATE.finanzas.metas.push(nuevo);
        renderizarFinanzas(APP_STATE.finanzas);

        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) cargarFinanzas(true);
            })
            .withFailureHandler(function(err) {
                alert("Error al crear meta: " + err.message);
            })
            .agregarMeta(nombre, total, ahorrado, meses, mesPeriodo);
    }

    /**
     * Abona una cuota quincenal a la meta en tiempo real.
     */
    function abonarCuotaMetaUI(id) {
        if (!APP_STATE.finanzas || !APP_STATE.finanzas.metas) return;

        var target = null;
        for (var i = 0; i < APP_STATE.finanzas.metas.length; i++) {
            if (String(APP_STATE.finanzas.metas[i].id) === String(id)) {
                target = APP_STATE.finanzas.metas[i];
                break;
            }
        }

        if (target) {
            var cuota = Number(target.cuotaQuincenal) || 0;
            target.ahorrado = Math.min(target.metaTotal, target.ahorrado + cuota);
            target.faltante = Math.max(0, target.metaTotal - target.ahorrado);
            renderizarFinanzas(APP_STATE.finanzas);
        }

        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) cargarFinanzas(true);
            })
            .withFailureHandler(function(err) {
                console.error("Error al abonar cuota:", err);
            })
            .abonarCuotaMeta(id);
    }

    /**
     * Elimina cualquier registro financiero (ingreso, gasto, deuda, meta).
     */
    function eliminarRegistroFinanzasUI(id, tipo) {
        if (!confirm("¿Deseas eliminar este registro financiero?")) return;

        if (APP_STATE.finanzas) {
            if (tipo === 'ingreso' && APP_STATE.finanzas.ingresos) {
                APP_STATE.finanzas.ingresos = APP_STATE.finanzas.ingresos.filter(function(x) { return x.id !== id; });
            } else if (tipo === 'gasto' && APP_STATE.finanzas.gastos) {
                APP_STATE.finanzas.gastos = APP_STATE.finanzas.gastos.filter(function(x) { return x.id !== id; });
            } else if (tipo === 'deuda' && APP_STATE.finanzas.deudas) {
                APP_STATE.finanzas.deudas = APP_STATE.finanzas.deudas.filter(function(x) { return x.id !== id; });
            } else if (tipo === 'meta' && APP_STATE.finanzas.metas) {
                APP_STATE.finanzas.metas = APP_STATE.finanzas.metas.filter(function(x) { return x.id !== id; });
            }
            renderizarFinanzas(APP_STATE.finanzas);
        }

        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) cargarFinanzas(true);
            })
            .withFailureHandler(function(err) {
                alert("Error al eliminar registro: " + err.message);
            })
            .eliminarRegistroFinanzas(id);
    }

    /**
     * Abre el detalle de una categoría específica con sus subcategorías, contextos y listas limpias.

        if (!catNombre) catNombre = Object.keys(ESTRUCTURA_BANCO_IDEAS)[0];

                <h3 style="margin: 0; color: #fbbf24; font-size: 18px; display: flex; align-items: center; gap: 8px;">
                    <span>${info ? info.icono : '💡'}</span>
                    <span>${catNombre}</span>
                </h3>
                <p style="margin: 4px 0 0 0; font-size: 12px; color: #94a3b8;">
                    Ideas pendientes organizadas cronológicamente de más viejas a más nuevas.
                </p>
            `;
        }

        var listCont = document.getElementById('contenedor-subcategorias-lista');
        if (!listCont) return;

        var ideas = APP_STATE.ideas || [];
        var subcategorias = (info && info.subcategorias) ? info.subcategorias : ["General"];
        var filtroContexto = ESTADO_IDEAS.filtroContextoDetalle;

        var html = "";

        subcategorias.forEach(function(subNombre) {
            // Filtrar ideas no hechas de esta categoría y subcategoría
            var subIdeas = ideas.filter(function(i) {
                var coincideCat = (i.categoria === catNombre);
                var coincideSub = (i.subcategoria === subNombre || (!i.subcategoria && subNombre.includes("General")));
                var noHecha = !i.hecha;
                var coincideContexto = (filtroContexto === 'TODOS' || i.contexto === filtroContexto);
                return coincideCat && coincideSub && noHecha && coincideContexto;
            });

            // REGLA CRUCIAL: Orden cronológico estricto de más viejos (ejem: 06/06) a más nuevos (ejem: 07/06)
            subIdeas.sort(function(a, b) {
                return (a.timestamp || 0) - (b.timestamp || 0);
            });

            html += `
                <div class="subcategory-section">
                    <div class="subcategory-title">
                        <span>${subNombre}</span>

                        </span>
                    </div>
                    <div class="idea-clean-list">
            `;

            if (subIdeas.length === 0) {
                html += `
                    <div style="font-size: 13px; color: #64748b; padding: 6px 10px; font-style: italic;">
                        - (No hay ideas pendientes en esta subcategoría)
                    </div>

            } else {
                subIdeas.forEach(function(idea) {
                    html += `
                        <div class="idea-clean-item" id="idea-card-${idea.id}">
                            <div class="idea-item-left">
                                <span class="idea-dash">-</span>
                                <div class="idea-item-content">
                                    <div class="idea-text-line">
                                        ${idea.texto}
                                    </div>
                                    <div class="idea-meta-badges">
                                        <span class="idea-context-badge">${idea.contexto || '🏠 Casa'}</span>
                                        ${idea.fecha ? `<span style="font-size: 10px; color: #64748b;">${idea.fecha}</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div>
                                <button class="idea-btn-check" onclick="marcarIdeaHechaUI('${idea.id}', true)">
                                    <span>○</span> Marcar Hecha
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                </div>
            `;
        });

        listCont.innerHTML = html;
    }

    /**
     * Registra y publica una nueva idea en el Banco de Ideas.
     * Añade automáticamente la fecha al final en formato (DD/MM).
     */
    function guardarNuevaIdea() {
        var input = document.getElementById('input-nueva-idea');
        var catSelect = document.getElementById('select-categoria-idea');
        var subSelect = document.getElementById('select-subcategoria-idea');
        var btn = document.getElementById('btn-publicar-idea');

        var texto = input ? input.value.trim() : "";
        if (!texto) {
            alert("Por favor escribe el contenido de tu idea.");
            if (input) input.focus();
            return;
        }

        var categoria = catSelect ? catSelect.value : "💭 Ideas y Pensamientos";
        var subcategoria = subSelect ? subSelect.value : "General";
        var contexto = ESTADO_IDEAS.contextoSeleccionado || "🏠 Casa";

        // Obtener fecha actual en formato DD/MM (ej: 06/06 o 28/09)
        var hoy = new Date();
        var dia = String(hoy.getDate()).padStart(2, '0');
        var mes = String(hoy.getMonth() + 1).padStart(2, '0');
        var fechaCorta = dia + "/" + mes;

        // REGLA CRUCIAL: A todas mis ideas creadas le colocarás la fecha al final de la idea
        if (!/\d{1,2}\/\d{1,2}$/.test(texto)) {
            texto += " " + fechaCorta;
        }

        if (btn) {
            btn.disabled = true;
            btn.textContent = "Publicando...";
        }

        google.script.run
            .withSuccessHandler(function(res) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = "⚡ Publicar";
                }
                if (input) input.value = '';

                if (res && res.success && res.idea) {
                    if (!APP_STATE.ideas) APP_STATE.ideas = [];
                    APP_STATE.ideas.push(res.idea);
                    renderizarBancoIdeas();
                } else {
                    cargarIdeas(true);
                }
            })
            .withFailureHandler(function(err) {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = "⚡ Publicar";
                }
                alert("Error al registrar idea: " + err.message);
            })
            .registrarIdea(categoria, subcategoria, contexto, texto);
    }

    /**

    function marcarIdeaHechaUI(id, estado) {
        var ideas = APP_STATE.ideas || [];
        var targetIdea = null;

        for (var i = 0; i < ideas.length; i++) {
            if (String(ideas[i].id) === String(id)) {
                targetIdea = ideas[i];
                targetIdea.hecha = !!estado;
                targetIdea.timestampHecha = estado ? Date.now() : 0;
                var hoy = new Date();
                targetIdea.fechaHecha = estado ? (hoy.toLocaleDateString() + " " + hoy.toLocaleTimeString()) : "";
                break;
            }
        }

        // Refrescar UI inmediatamente (optimistic UI)
        renderizarBancoIdeas();

        // Enviar al servidor para persistir en la hoja "Banco de Ideas"
        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) {
                    actualizarBadgesIdeas();
                }
            })
            .withFailureHandler(function(err) {
                console.error("Error al actualizar estado de la idea:", err);
            })

    /**
     * Helper para obtener la fecha correspondiente al mes de Operatividad seleccionado.
     */
    function obtenerFechaObjetivoMes() {
        var fecha = new Date();
        fecha.setMonth(fecha.getMonth() + (ESTADO_IDEAS.mesOperatividadOffset || 0));
        return fecha;
    }

    /**
     * Determina si una idea fue ejecutada durante el mes objetivo.
     */
    function esIdeaDelMes(idea, fechaObjetivo) {
        var d = null;
        if (idea.timestampHecha) {
            d = new Date(idea.timestampHecha);
        } else if (idea.fechaHecha) {
            var cleanStr = String(idea.fechaHecha).trim();
            var parts = cleanStr.split(" ")[0].split("/");
            if (parts.length === 3) {
                d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
        }
        if (!d && idea.timestamp) {
            d = new Date(idea.timestamp);
        }
        if (!d || isNaN(d.getTime())) return false;

        return (d.getMonth() === fechaObjetivo.getMonth() && d.getFullYear() === fechaObjetivo.getFullYear());
    }

     * Navega entre meses en la vista de Operatividad.
     */
    function cambiarMesOperatividad(delta) {

    /**
     * Renderiza la vista de Operatividad: Métricas, Gráfico de Chart.js y lista de ideas ejecutadas.
     */
    function mostrarVistaOperatividad() {
        ESTADO_IDEAS.subvistaActual = 'operatividad';

        var gridCont = document.getElementById('vista-ideas-categorias-grid');
        var detalleCont = document.getElementById('vista-ideas-categoria-detalle');
        var opCont = document.getElementById('vista-ideas-operatividad');

        if (gridCont) gridCont.style.display = 'none';
        if (detalleCont) detalleCont.style.display = 'none';
        if (opCont) opCont.style.display = 'block';

        var fechaObjetivo = obtenerFechaObjetivoMes();
        var opciones = { month: 'long', year: 'numeric' };
        var nombreMes = fechaObjetivo.toLocaleDateString('es-ES', opciones);

        var labelMes = document.getElementById('label-mes-operatividad');
        if (labelMes) labelMes.textContent = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);

        var ideas = APP_STATE.ideas || [];

        // Filtrar ideas ejecutadas en este mes
        var ideasHechasMes = ideas.filter(function(i) {
            return i.hecha && esIdeaDelMes(i, fechaObjetivo);
        });

        // Conteo por categoría
        var conteoPorCat = {};
        Object.keys(ESTRUCTURA_BANCO_IDEAS).forEach(function(cat) {
            conteoPorCat[cat] = 0;
        });

        ideasHechasMes.forEach(function(i) {
            var cat = i.categoria || "💭 Ideas y Pensamientos";
            if (!conteoPorCat[cat]) conteoPorCat[cat] = 0;
            conteoPorCat[cat]++;
        });

        // Categoría top
        var maxCat = "-";
        var maxCount = 0;
        Object.keys(conteoPorCat).forEach(function(cat) {
            if (conteoPorCat[cat] > maxCount) {
                maxCount = conteoPorCat[cat];
                maxCat = cat;
            }
        });

        // Actualizar métricas en pantalla
        var metricHechas = document.getElementById('metric-ideas-hechas-mes');
        if (metricHechas) metricHechas.textContent = ideasHechasMes.length;

        var metricTop = document.getElementById('metric-ideas-categoria-top');
        if (metricTop) metricTop.textContent = maxCat !== "-" ? maxCat : "Sin registros";

        var totalIdeasMes = ideas.filter(function(i) {
            return esIdeaDelMes(i, fechaObjetivo);
        }).length;
        var tasa = totalIdeasMes > 0 ? Math.round((ideasHechasMes.length / totalIdeasMes) * 100) : (ideasHechasMes.length > 0 ? 100 : 0);

        var metricTasa = document.getElementById('metric-tasa-operatividad');
        if (metricTasa) metricTasa.textContent = tasa + "%";

        // Renderizar o actualizar Gráfico de Operatividad con Chart.js
        renderizarGraficoOperatividad(conteoPorCat);

        // Renderizar lista de ideas ejecutadas en el mes
        renderizarListaOperatividad(ideasHechasMes);
    }

    /**
     * Dibuja el gráfico de barras/operatividad usando Chart.js o canvas nativo.
     */
    function renderizarGraficoOperatividad(conteoPorCat) {
        var canvas = document.getElementById('graficoOperatividad');
        if (!canvas) return;

        var labels = Object.keys(ESTRUCTURA_BANCO_IDEAS);
        var datos = labels.map(function(l) { return conteoPorCat[l] || 0; });

        // Si Chart.js está disponible
        if (typeof Chart !== 'undefined') {
            if (ESTADO_IDEAS.graficoChartInstance) {
                ESTADO_IDEAS.graficoChartInstance.destroy();
            }

            var ctx = canvas.getContext('2d');
            ESTADO_IDEAS.graficoChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(function(l) {
                        // Abreviar o limpiar etiqueta para el gráfico
                        return l.replace(/^[^\w\s]+/, '').trim();
                    }),
                    datasets: [{
                        label: 'Ideas Ejecutadas',
                        data: datos,
                        backgroundColor: [
                            '#111827', // Negro Carbón
                            '#374151', // Gris Grafito
                            '#4b5563', // Gris Medio
                            '#6b7280', // Pizarra
                            '#9ca3af'  // Gris Suave
                        ],
                        borderColor: [
                            '#111827', '#374151', '#4b5563', '#6b7280', '#9ca3af'
                        ],
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#111827',
                            titleColor: '#ffffff',
                            bodyColor: '#e5e7eb',
                            borderColor: '#27272a',
                            borderWidth: 1,
                            padding: 10,
                            cornerRadius: 8
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#6b7280',
                                font: { family: "'Plus Jakarta Sans', sans-serif", size: 11 },
                                stepSize: 1,
                                precision: 0
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#374151',
                                font: { family: "'Plus Jakarta Sans', sans-serif", size: 11, weight: '600' }
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        } else {
            // Fallback en caso de no cargar Chart.js
            var ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px sans-serif';
            ctx.fillText('Módulo de Gráficos Operativos activo', 20, 50);
        }
    }

    /**
     * Renderiza la lista limpia de ideas ejecutadas en el mes con opción de desmarcar.
     */
    function renderizarListaOperatividad(ideasHechas) {
        var listCont = document.getElementById('contenedor-lista-operatividad');
        var badgeCont = document.getElementById('badge-contador-hechas-lista');
        if (badgeCont) badgeCont.textContent = ideasHechas.length + (ideasHechas.length === 1 ? ' idea' : ' ideas');

        if (!listCont) return;

        if (ideasHechas.length === 0) {
            listCont.innerHTML = `
                <div style="font-size: 13px; color: #64748b; padding: 12px; text-align: center; font-style: italic;">
                    No hay ideas marcadas como hechas en este mes aún.
                </div>
            `;
            return;
        }

        // Ordenar de más recientes a más antiguas
        ideasHechas.sort(function(a, b) {
            return (b.timestampHecha || 0) - (a.timestampHecha || 0);
        });

        var html = "";
        ideasHechas.forEach(function(i) {
            html += `
                <div class="idea-clean-item is-done">
                    <div class="idea-item-left">
                        <span class="idea-dash" style="color: #34d399;">✓</span>
                        <div class="idea-item-content">
                            <div class="idea-text-line" style="text-decoration: line-through; color: #94a3b8;">
                                ${i.texto}
                            </div>
                            <div class="idea-meta-badges">
                                <span class="idea-context-badge" style="border-color: #059669; color: #34d399;">
                                    ${i.categoria}
                                </span>
                                <span class="idea-context-badge">${i.contexto || '🏠 Casa'}</span>
                                ${i.fechaHecha ? `<span style="font-size: 11px; color: #10b981;">Hecha: ${i.fechaHecha}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div>
                        <button class="idea-btn-check checked" onclick="marcarIdeaHechaUI('${i.id}', false)" title="Desmarcar y devolver a pendientes">
                            ✓ Hecha (Deshacer)
                        </button>
                    </div>
                </div>
            `;
        });

        listCont.innerHTML = html;
    }

    /**
     * Invocable desde la UI para asegurar y crear la hoja de cálculo "Banco de Ideas".
     */
    function inicializarHojaSheetsDesdeUI() {
        google.script.run
            .withSuccessHandler(function(res) {
                if (res && res.success) {
                    alert("✅ Hoja 'Banco de Ideas' creada y formateada con casillas de verificación en Google Sheets.");
                    cargarIdeas(true);
                } else {
                    alert("Aviso: " + (res.error || "Operación completada."));
                }
            })
            .withFailureHandler(function(err) {
                alert("Error al inicializar hoja en Sheets: " + err.message);
            })
            .crearHojaBancoDeIdeasManual();
    }

    // --------------------------------------------------------------------------
    // CALENDARIO DEL SISTEMA
    // --------------------------------------------------------------------------
    function renderizarCalendario() {
        var hoy = new Date();
        var opcionesMes = { month: 'long', year: 'numeric' };
        var nombreMes = hoy.toLocaleDateString('es-ES', opcionesMes);
        var diaActual = hoy.getDate();

        var html = `<div style="text-align: center; padding: 20px;">
            <h3 style="color: #fbbf24; text-transform: capitalize; margin-bottom: 15px;">${nombreMes}</h3>
            <p style="color: #94a3b8; margin-bottom: 20px;">Día del Sistema Activo: <strong style="color: #60a5fa; font-size: 20px;">${diaActual}</strong></p>
            <div style="background-color: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; display: inline-block;">
                <p style="margin: 0; color: #f8fafc; font-size: 14px;">📅 Cronograma de Misiones y Hábitos sincronizado correctamente.</p>
            </div>
        </div>`;
        var cont = document.getElementById('contenedor-calendario');
        if (cont) cont.innerHTML = html;
    }
</script>
